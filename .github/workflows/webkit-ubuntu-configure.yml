name: WebKit v2 one-time Ubuntu configure
run-name: WebKit 2.54.3 Ubuntu configure and resource only at ${{ github.sha }}
'on':
  push:
    branches: [v2]
    paths: [release/webkit-ubuntu-configure-request.json]
permissions:
  contents: read
concurrency:
  group: milkup-webkit-v2-configure-once
  cancel-in-progress: false
jobs:
  configure:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/v2' &&
      github.event_name == 'push' &&
      github.event.deleted == false &&
      github.event.before == '8f144679eb43aa97477c8107f66295ae6976aaf9' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[webkit-ubuntu-827-once]')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Anonymous exact public input checkout and revision lock
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
            HOME="$RUNNER_TEMP/milkup-configure-home" TMPDIR="$RUNNER_TEMP" \
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            SOURCE_SHA="$GITHUB_SHA" /bin/bash --noprofile --norc -eu -c '
              [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
              mkdir "$HOME"
              repo="$TMPDIR/milkup-configure-source"
              git init "$repo"
              git -C "$repo" config core.sparseCheckout true
              printf "%s\n" /scripts/release/webkit-ubuntu-configure/ /release/webkit-ubuntu-configure-request.json > "$repo/.git/info/sparse-checkout"
              git -C "$repo" -c credential.helper= fetch --filter=blob:none --depth=2 --no-tags https://github.com/Auto-Plugin/milkup.git "$SOURCE_SHA"
              git -C "$repo" -c credential.helper= checkout --detach FETCH_HEAD
              test "$(git -C "$repo" rev-parse HEAD)" = "$SOURCE_SHA"
              test "$(git -C "$repo" rev-parse HEAD^)" = "8f144679eb43aa97477c8107f66295ae6976aaf9"
              python3 "$repo/scripts/release/webkit-ubuntu-configure/check-inputs.py" "$repo"
            '
      - name: Authenticated SDK, actual Clang, GTK3 configure and bounded resource
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
            HOME="$RUNNER_TEMP/milkup-configure-home" TMPDIR="$RUNNER_TEMP" \
            python3 "$RUNNER_TEMP/milkup-configure-source/scripts/release/webkit-ubuntu-configure/run.py" \
            "$RUNNER_TEMP/milkup-configure-work"
      - name: Remove only this job's owned temporary outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in milkup-configure-work milkup-configure-source milkup-configure-home; do
            owned="$RUNNER_TEMP/$name"
            test ! -L "$owned"
            if test -d "$owned"; then rm -rf -- "$owned"; fi
          done
# No uploads, caches, installation, native application launch, full build or retry.
