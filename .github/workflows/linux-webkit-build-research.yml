name: Isolated Ubuntu WebKit source and build capability research
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Cheap header/cache preflight or one explicitly approved continuation
        type: choice
        options: [preflight, resume, pagination-preflight, pagination-diagnostic, pagination-segment, stock-paper-control]
        default: preflight
        required: true
      links_research:
        description: URI annotation research only; no application reinstall or full GUI rerun
        type: boolean
        default: false
      geometry_research:
        description: Independent print-layout capture and fragment/clip counterexamples; engine only
        type: boolean
        default: false
      paint_research:
        description: One bounded paint-phase A/B delta inheriting the accepted 43660565818 TU gate
        type: boolean
        default: false
      digit_research:
        description: One new FontCascade TU gate then a bounded digit/retained-contract private probe
        type: boolean
        default: false
      digit_followup:
        description: Reuse exact successful 43670757867 build/TU evidence; only corrected Noto A/B
        type: boolean
        default: false
      preflight_run:
        description: Exact successful same-SHA preflight run required for resume
        type: string
        default: ''
      pagination_behavior:
        description: Research first-fragment/header candidate; requires exact 43808221193 object restore
        type: boolean
        default: false
      pagination_tail:
        description: Read-only root and final-margin diagnosis after exact behavior patch
        type: boolean
        default: false
      pagination_restore_run:
        description: Optional exact prior pagination-segment object artifact run; mismatches stop
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-webkit-build-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capability:
    if: github.repository == 'Auto-Plugin/milkup' && inputs.operation != 'pagination-preflight' && inputs.operation != 'pagination-diagnostic' && inputs.operation != 'pagination-segment' && inputs.operation != 'stock-paper-control'
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.operation == 'preflight' && 30 || inputs.geometry_research && 55 || 355 }}
    env:
      CCACHE_COMPILERCHECK: content
      MILKUP_WEBKIT_GEOMETRY: ${{ inputs.geometry_research }}
      MILKUP_WEBKIT_DIGIT_FOLLOWUP: ${{ inputs.digit_followup }}
      MILKUP_WEBKIT_DIGITS: ${{ inputs.digit_research }}
      MILKUP_WEBKIT_PAINT: ${{ inputs.paint_research }}
      MILKUP_WEBKIT_LINKS: ${{ inputs.links_research }}
      MILKUP_WEBKIT_OPERATION: ${{ inputs.operation }}
      BASELINE_SHA: b877746f5dfd236dfc13f718ed23d837b8e4f89d
    defaults:
      run:
        shell: bash
    steps:
      - name: Start bounded operation clock
        run: |
          echo "MILKUP_RESEARCH_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/milkup-webkit-ccache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify resource and acceptance-reserve policy
        run: python3 scripts/ci/webkit_build_limits_test.py
      - name: Require exact successful preflight before expensive continuation
        if: inputs.operation == 'resume' && !inputs.digit_followup
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: |
          [[ "$PREFLIGHT_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/Auto-Plugin/milkup/actions/runs/$PREFLIGHT_RUN" > "$RUNNER_TEMP/prior-preflight-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'prior-preflight-run.json').read_text())
          expected='835fece0c1ebeb02d50de8f0fc23a7a4b1f3b862' if os.environ['MILKUP_WEBKIT_PAINT']=='true' else os.environ['GITHUB_SHA']
          assert r['head_sha']==expected and r['event']=='workflow_dispatch' and r['conclusion']=='success' and r['status']=='completed'
          assert r['path']=='.github/workflows/linux-webkit-build-research.yml'
          PY
          gh run download "$PREFLIGHT_RUN" --repo Auto-Plugin/milkup --name "milkup-webkit-build-capability-$PREFLIGHT_RUN" --dir "$RUNNER_TEMP/prior-preflight"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'prior-preflight'
          r=json.loads((p/'build-result.json').read_text())
          expected='835fece0c1ebeb02d50de8f0fc23a7a4b1f3b862' if os.environ['MILKUP_WEBKIT_PAINT']=='true' else os.environ['GITHUB_SHA']
          assert r['harnessSha']==expected and r['status']=='preflight-passed-not-engine-built'
          assert r.get('linksResearch',False)==(os.environ['MILKUP_WEBKIT_LINKS']=='true')
          assert r.get('geometryResearch',False)==(os.environ['MILKUP_WEBKIT_GEOMETRY']=='true')
          if os.environ['MILKUP_WEBKIT_GEOMETRY']=='true':
            assert r['preflight']['geometryActualObjects']=='passed'
            assert json.loads((p/'geometry-object-gate/result.json').read_text())['status']=='passed'
          assert r['fullEngineBuildAttempted'] is False and r['objectCacheProbeAttempted'] is True
          assert json.loads((p/'header-preflight/result.json').read_text())['status']=='passed'
          assert json.loads((p/'cache-preflight/result.json').read_text())['status']=='passed'
          if os.environ['MILKUP_WEBKIT_LINKS']=='true':
            assert json.loads((p/'links-preflight/result.json').read_text())['status']=='passed'
            assert json.loads((p/'links-baseline/result.json').read_text())['status']=='passed'
          PY
      - name: Bind paint-only delta to exact inherited gate without repeating old TU tests
        if: inputs.paint_research && !inputs.digit_followup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$MILKUP_WEBKIT_OPERATION" = resume
          test "$MILKUP_WEBKIT_GEOMETRY" = true
          test "$MILKUP_WEBKIT_LINKS" = true
          if [[ "$MILKUP_WEBKIT_DIGITS" == true ]]; then
            test "$MILKUP_WEBKIT_PAINT" = true
          fi
          python3 scripts/ci/webkit-paint-inheritance-test.py
          gh api "repos/Auto-Plugin/milkup/compare/835fece0c1ebeb02d50de8f0fc23a7a4b1f3b862...$GITHUB_SHA" > "$RUNNER_TEMP/paint-compare.json"
          python3 scripts/ci/webkit-paint-inheritance.py "$RUNNER_TEMP" "$GITHUB_SHA"
      - name: Bind exact successful digit sub-gates while retaining original failed status
        if: inputs.digit_followup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$MILKUP_WEBKIT_OPERATION" = resume
          test "$MILKUP_WEBKIT_DIGITS" = true
          test "$MILKUP_WEBKIT_PAINT" = true
          test "$MILKUP_WEBKIT_GEOMETRY" = true
          test "$MILKUP_WEBKIT_LINKS" = true
          gh api repos/Auto-Plugin/milkup/actions/runs/43670757867 > "$RUNNER_TEMP/prior-digit-run.json"
          gh api repos/Auto-Plugin/milkup/actions/artifacts/14144710984/zip > "$RUNNER_TEMP/prior-digit.zip"
          python3 - <<'PYZIP'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);p=root/'prior-digit.zip'
          assert p.stat().st_size==2678143
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='5937391c96771c74f5a8b167eecf953405032e319dd04b6070f2997546ee564c'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None and sum(i.file_size for i in z.infolist())<100*1024*1024
            for i in z.infolist():assert not pathlib.PurePosixPath(i.filename).is_absolute() and '..' not in pathlib.PurePosixPath(i.filename).parts
            z.extractall(root/'prior-digit')
          PYZIP
          python3 scripts/ci/webkit-digit-followup-test.py
          gh api "repos/Auto-Plugin/milkup/compare/7b589d0d1d3127bd11bf8c20dae3d0a7bb3f9f2d...$GITHUB_SHA" > "$RUNNER_TEMP/digit-compare.json"
          python3 scripts/ci/webkit-digit-followup.py "$RUNNER_TEMP" "$GITHUB_SHA"
      - name: Restore matching bounded compiler-object cache only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/milkup-webkit-ccache
          key: webkit-u2604-2526-${{ hashFiles('scripts/ci/build-webkit-private.py', 'research/linux-pdf-unicode-20261114/*.patch', 'research/linux-pdf-links-20261114/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            webkit-u2604-2526-${{ hashFiles('scripts/ci/build-webkit-private.py', 'research/linux-pdf-unicode-20261114/*.patch', 'research/linux-pdf-links-20261114/*.patch') }}-
            webkit-u2604-2526-70a401930d637c6401ae81b8684e4dee1819b59b3ffca6618c2d8ef04b3c1714-43670757867
            webkit-u2604-2526-8957d10423c6f6139c1b9133d5b18f730ae99865c0c632b8e4e95d98902ef191-43668937059
            webkit-u2604-2526-3487c8a25edc98bb6feb8e45687e4f57ebfc601f1a346513a80dfffe53683086-43661203007
            webkit-u2604-2526-bcb6fcc0b8643e5da329995cdb243c9a8741ca1923b961729f101add7aefb9e3-43640203869
            webkit-u2604-2526-c5b4b302f5be52b15bb31806a17fdc4582a5f54940772934cb71e6c95ba714a0-43624922086
            webkit-u2604-2526-f49aafb7686f22659a2e83f28dfab7be0058bcf1e750789dab9a24de2ecf8e13-43614932570
            webkit-u2604-2526-a7910481056bef2fbcf3ec8b2ab12691665d22560f7b11debcfb04d4fc749b33-43590136844
      - name: Obtain authenticated official source and measure build prerequisites
        run: python3 scripts/ci/probe-webkit-distro-build.py
      - name: Build matched GTK3 runtime in private normal-user prefix
        run: python3 scripts/ci/build-webkit-private.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.operation == 'resume' && !inputs.links_research
        with:
          node-version: 24.19.0
      - name: Reuse exact new candidate built in run 43558261633
        if: inputs.operation == 'resume' && !inputs.links_research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/linux-native-evidence"
          gh api repos/Auto-Plugin/milkup/actions/artifacts/14099980957/zip > "$RUNNER_TEMP/new-candidate.zip"
          python3 - <<'PY'
          import os,json,pathlib,hashlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'new-candidate.zip'
          assert archive.stat().st_size==9811122
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='6ea16526fdda7904bf54279bc2b03dfa9d546d7411abde02bcb53b9beeef3db1'
          dest=root/'milkup-candidate/deliverable';dest.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for i in z.infolist():
                  assert not pathlib.PurePosixPath(i.filename).is_absolute() and '..' not in pathlib.PurePosixPath(i.filename).parts
                  assert i.file_size<=20000000
              z.extractall(dest)
          m=json.loads((dest/'manifest.json').read_text())
          assert m['sourceSha']==os.environ['BASELINE_SHA']
          p=dest/m['installer']['name'];actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==m['installer']['sha256']=='4941f3a1ab85b7c7ed1d96edf4807c388a7c883240a2aa32ee13c062661fc813'
          assert p.stat().st_size==m['installer']['bytes']==9853762
          evidence=root/'linux-native-evidence'
          (evidence/'new-build-manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          (evidence/'original-comparison.json').write_text(json.dumps({'sourceSha':m['sourceSha'],'harnessSha':os.environ['GITHUB_SHA'],'buildRun':43558261633,'artifactId':14099980957,'originalDebSha256':'36c4873d840a06e85bf08398e119f9ddb494c813727eff6479aa4e434141f86e','newDebSha256':actual,'identicalBytes':False,'scope':'Same new candidate bytes from official b877 rebuild; not the preserved original deb'},indent=2)+'\n')
          PY
      - name: Install new package and verify exact installed binary
        if: inputs.operation == 'resume' && !inputs.links_research
        run: |
          if dpkg-query --status milkup >/dev/null 2>&1; then echo 'Refusing to replace an existing installation' >&2; exit 1; fi
          package=("$RUNNER_TEMP"/milkup-candidate/deliverable/*.deb)
          test "${#package[@]}" = 1
          dpkg-deb --extract "${package[0]}" "$RUNNER_TEMP/milkup-package-extracted"
          sudo dpkg --install "${package[0]}" 2>&1 | tee "$RUNNER_TEMP/linux-native-evidence/install.txt"
          touch "$RUNNER_TEMP/linux-native-evidence/installed-by-this-run"
          cmp "$RUNNER_TEMP/milkup-package-extracted/usr/bin/milkup-desktop" /usr/bin/milkup-desktop
          sha256sum /usr/bin/milkup-desktop > "$RUNNER_TEMP/linux-native-evidence/installed-binary.sha256"
          ldd /usr/bin/milkup-desktop > "$RUNNER_TEMP/linux-native-evidence/installed-ldd.txt"
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 install tauri-driver --version 2.1.0 --locked
      - name: Verify private sandbox and installed-app PDF through matched runtime
        if: inputs.operation == 'resume' && !inputs.links_research
        timeout-minutes: 12
        run: |
          test "$(id -u)" != 0
          test -z "${WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS:-}"
          export MILKUP_RESEARCH_RUNTIME_PREFIX="$RUNNER_TEMP/milkup-webkit-research/prefix"
          export MILKUP_RESEARCH_BUILD_MANIFEST="$RUNNER_TEMP/milkup-webkit-research/evidence/build-result.json"
          export PKG_CONFIG_PATH="$MILKUP_RESEARCH_RUNTIME_PREFIX/lib/x86_64-linux-gnu/pkgconfig"
          cc scripts/ci/linux-webkit-preflight.c -o "$RUNNER_TEMP/milkup-webkit-preflight" $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0)
          LD_LIBRARY_PATH="$MILKUP_RESEARCH_RUNTIME_PREFIX/lib/x86_64-linux-gnu" timeout --signal=TERM --kill-after=5s 40s xvfb-run -a dbus-run-session -- "$RUNNER_TEMP/milkup-webkit-preflight" 2>&1 | tee "$RUNNER_TEMP/linux-native-evidence/private-webkit-preflight.txt"
          cc -Wall -Wextra -Werror scripts/ci/linux-window-close.c -o "$RUNNER_TEMP/milkup-window-close" -lX11
          node --test scripts/ci/linux-private-runtime.test.mjs
          timeout --signal=TERM --kill-after=10s 650s xvfb-run -a -s '-screen 0 1400x1000x24' dbus-run-session -- bash scripts/ci/run-linux-installed-gui.sh 2>&1 | tee "$RUNNER_TEMP/linux-native-evidence/private-gui-harness.txt"
      - name: Verify URI annotations in the actual private print engine
        if: inputs.operation == 'resume' && inputs.links_research
        timeout-minutes: 5
        run: |
          geometry_args=()
          if [[ "$MILKUP_WEBKIT_GEOMETRY" == true ]]; then geometry_args+=(--geometry); fi
          if [[ "$MILKUP_WEBKIT_PAINT" == true ]]; then geometry_args+=(--paint); fi
          if [[ "$MILKUP_WEBKIT_DIGITS" == true ]]; then geometry_args+=(--digits); fi
          if [[ "$MILKUP_WEBKIT_DIGIT_FOLLOWUP" == true ]]; then geometry_args+=(--digits-only); fi
          python3 scripts/ci/run-webkit-link-probe.py verify "$RUNNER_TEMP/milkup-webkit-research/evidence/links-patched" --prefix "$RUNNER_TEMP/milkup-webkit-research/prefix" --manifest "$RUNNER_TEMP/milkup-webkit-research/evidence/build-result.json" "${geometry_args[@]}"
      - name: Remove only this run's package
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/linux-native-evidence/installed-by-this-run"; then
            sudo dpkg --remove milkup 2>&1 | tee "$RUNNER_TEMP/linux-native-evidence/uninstall.txt"
            test ! -e /usr/bin/milkup-desktop
          fi
      - name: Preserve installed-app research evidence including failing PDFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-private-webkit-installed-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-native-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve capability evidence without publishing a runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-webkit-build-capability-${{ github.run_id }}
          path: ${{ runner.temp }}/milkup-webkit-research/evidence/
          retention-days: 7
          if-no-files-found: error

      - name: Retain bounded compiler objects for a future explicitly authorized resume
        if: always() && hashFiles('scripts/ci/build-webkit-private.py') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/milkup-webkit-ccache
          key: webkit-u2604-2526-${{ hashFiles('scripts/ci/build-webkit-private.py', 'research/linux-pdf-unicode-20261114/*.patch', 'research/linux-pdf-links-20261114/*.patch') }}-${{ github.run_id }}

  pagination-preflight:
    if: github.repository == 'Auto-Plugin/milkup' && (inputs.operation == 'pagination-preflight' || (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment'))
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.operation == 'pagination-segment' && 180 || 75 }}
    env:
      CCACHE_COMPILERCHECK: content
      PAGINATION_OPERATION: ${{ inputs.operation }}
      PAGINATION_RESTORE_RUN: ${{ inputs.pagination_restore_run }}
      PAGINATION_BEHAVIOR: ${{ inputs.pagination_behavior }}
      PAGINATION_TAIL: ${{ inputs.pagination_tail }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin preflight scope before any restore or build
        run: |
          test "$(id -u)" != 0
          test -z "${WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS:-}"
          echo "CCACHE_DIR=$RUNNER_TEMP/milkup-webkit-ccache" >> "$GITHUB_ENV"
          echo "PAGINATION_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          python3 scripts/ci/webkit-pagination-preflight-test.py
          python3 scripts/ci/webkit-pagination-cache-test.py
          python3 research/pdf-pagination-mechanism-20261116/native_test.py
          python3 -m unittest discover -s research/pdf-pagination-mechanism-20261116 -p 'test_*.py'
          python3 -m unittest discover -s research/pdf-pagination-behavior-20261116 -p 'test_*.py'
      - name: Restore one exact existing compiler cache, never a runtime
        id: objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/milkup-webkit-ccache
          key: webkit-u2604-2526-edc7e59917fbad8635b3c87f62416989f35aec8ac8591b557de19ffcbd3ecd76-43672149274
          fail-on-cache-miss: true
      - name: Obtain authenticated matched source without an engine build
        timeout-minutes: 12
        run: python3 scripts/ci/probe-webkit-distro-build.py
      - name: Actual headers, first cache hits and four changed translation units only
        timeout-minutes: 31
        env:
          PAGINATION_CACHE_MATCHED_KEY: ${{ steps.objects.outputs.cache-matched-key }}
        run: python3 scripts/ci/webkit-pagination-preflight.py
      - name: Obtain only a deliberately selected prior object bundle
        if: inputs.operation == 'pagination-segment' && inputs.pagination_restore_run != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PAGINATION_RESTORE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/Auto-Plugin/milkup/actions/runs/$PAGINATION_RESTORE_RUN" > "$RUNNER_TEMP/milkup-webkit-research/evidence/incoming-object-run.json"
          python3 - <<'PYVERIFYRUN'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'milkup-webkit-research/evidence/incoming-object-run.json'
          r=json.loads(p.read_text())
          assert r['status']=='completed' and r['head_branch']=='dot/linux-webkit-build-probe-20261114'
          assert r['path']=='.github/workflows/linux-webkit-build-research.yml'
          PYVERIFYRUN
          gh run download "$PAGINATION_RESTORE_RUN" --repo Auto-Plugin/milkup --name "milkup-pagination-objects-$PAGINATION_RESTORE_RUN" --dir "$RUNNER_TEMP/pagination-incoming-objects"
      - name: Prove content-bound transfer and cross-process first cache hits
        id: cache-transfer
        if: inputs.operation == 'pagination-segment'
        timeout-minutes: 15
        run: |
          python3 scripts/ci/webkit-pagination-cache-live-test.py "$RUNNER_TEMP/milkup-webkit-research/evidence/segment-synthetic-cache-transfer.json"
          python3 scripts/ci/webkit-pagination-cache-roundtrip.py
      - name: Optional behavior candidate exact-source and actual-TU gate
        if: inputs.pagination_behavior && inputs.operation == 'pagination-segment'
        timeout-minutes: 25
        run: python3 research/pdf-pagination-behavior-20261116/compile_candidate.py
      - name: Only after four TUs pass, bounded cached observation runtime
        id: pagination-engine
        if: (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment')
        timeout-minutes: ${{ inputs.operation == 'pagination-segment' && 96 || 26 }}
        env:
          PAGINATION_OPERATION: ${{ inputs.operation }}
        run: |
          test "$(( $(date +%s) - PAGINATION_START_EPOCH ))" -lt 5400
          python3 scripts/ci/webkit-pagination-continue.py
      - name: Preserve verified compiler objects after success or controlled stop
        id: saved-objects
        if: always() && inputs.operation == 'pagination-segment' && steps.cache-transfer.outcome == 'success'
        timeout-minutes: 15
        run: |
          python3 - <<'PYSTOPPED'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'milkup-webkit-research/evidence/pagination-continuation.json'
          r=json.loads(p.read_text())
          assert r['status']!='running'
          assert not r['engineBuildAttempted'] or isinstance(r.get('compileExitCode'),int), 'Compiler termination uncertain; refuse snapshot'
          PYSTOPPED
          python3 scripts/ci/webkit-pagination-cache.py snapshot --cache "$CCACHE_DIR" --bundle "$RUNNER_TEMP/pagination-object-bundle" --evidence "$RUNNER_TEMP/milkup-webkit-research/evidence" > "$RUNNER_TEMP/milkup-webkit-research/evidence/segment-cache-save.json"
      - name: Retain content-bound objects only, no runtime or user data
        if: always() && steps.saved-objects.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-pagination-objects-${{ github.run_id }}
          path: ${{ runner.temp }}/pagination-object-bundle/
          retention-days: 7
          if-no-files-found: error
      - name: Official native probe prerequisites and exact retained assets
        if: (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment') && steps.pagination-engine.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "${WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS:-}"
          if dpkg-query --status milkup >/dev/null 2>&1; then echo 'Refusing existing installation'; exit 1; fi
          sudo apt-get -c "$RUNNER_TEMP/milkup-webkit-research/apt.conf" -y --no-install-recommends --no-remove install libwebkit2gtk-4.1-0=2.52.6-0ubuntu0.26.04.1 libgtk-3-0t64 xvfb xauth xdotool x11-utils fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core poppler-utils python3-lxml python3-pil python3-fitz
          gh api repos/Auto-Plugin/milkup/actions/artifacts/14149947936/zip > "$RUNNER_TEMP/pagination-original-package.zip"
          gh api repos/Auto-Plugin/milkup/actions/artifacts/14153980570/zip > "$RUNNER_TEMP/pagination-original-reference.zip"
          python3 research/pdf-pagination-mechanism-20261116/native_probe.py assets --package "$RUNNER_TEMP/pagination-original-package.zip" --reference "$RUNNER_TEMP/pagination-original-reference.zip" --output "$RUNNER_TEMP/pagination-native"
          dpkg-query -W libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 fonts-noto-cjk poppler-utils python3-fitz > "$RUNNER_TEMP/pagination-native/runtime-versions.txt"
      - name: Install only the exact previously tested package, bind original guard
        if: (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment') && steps.pagination-engine.outcome == 'success'
        timeout-minutes: 2
        run: |
          package=("$RUNNER_TEMP"/pagination-native/package/*.deb)
          test "${#package[@]}" = 1
          touch "$RUNNER_TEMP/pagination-native/installation-owned-by-run"
          sudo dpkg --install "${package[0]}" > "$RUNNER_TEMP/pagination-native/install.txt" 2>&1
          python3 - <<'PYVERIFY'
          import hashlib,pathlib
          assert hashlib.sha256(pathlib.Path('/usr/bin/milkup-desktop').read_bytes()).hexdigest()=='42394c4bdcaeea078c7d553acbe6edc7a75f13b16ce5b70cba2d0a3a02176ed6'
          PYVERIFY
      - name: One original-boundary native diagnostic batch, preserve known failures
        if: (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment') && steps.pagination-engine.outcome == 'success'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          PAGINATION_NATIVE_ENTRY=research/pdf-pagination-mechanism-20261116/native_probe.py
          if [ "$PAGINATION_BEHAVIOR" = true ]; then
            PAGINATION_NATIVE_ENTRY=research/pdf-pagination-behavior-20261116/native_probe.py
          fi
          timeout --signal=TERM --kill-after=10s 550s xvfb-run -a -s '-screen 0 1400x1000x24' dbus-run-session -- python3 "$PAGINATION_NATIVE_ENTRY" run --output "$RUNNER_TEMP/pagination-native" --prefix "$RUNNER_TEMP/milkup-webkit-research/prefix" --manifest "$RUNNER_TEMP/milkup-webkit-research/evidence/pagination-continuation.json" 2>&1 | tee "$RUNNER_TEMP/pagination-native/harness.txt"
      - name: Clean only this run's test installation
        if: always() && (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment')
        timeout-minutes: 2
        run: |
          if test -f "$RUNNER_TEMP/pagination-native/installation-owned-by-run"; then
            sudo dpkg --remove milkup > "$RUNNER_TEMP/pagination-native/uninstall.txt" 2>&1
            test ! -e /usr/bin/milkup-desktop
          fi
      - name: Retain raw original-boundary native diagnostic evidence
        timeout-minutes: 5
        if: always() && (inputs.operation == 'pagination-diagnostic' || inputs.operation == 'pagination-segment')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-pagination-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pagination-native/
            !${{ runner.temp }}/pagination-native/package/
            !${{ runner.temp }}/pagination-native/xdg-*/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain failure or successful preflight, never claim PDF acceptance
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-pagination-tu-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/milkup-webkit-research/evidence/
          retention-days: 7
          if-no-files-found: warn

  stock-paper-control:
    if: github.repository == 'Auto-Plugin/milkup' && inputs.operation == 'stock-paper-control'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stock capture and exact-input contracts before dependencies
        timeout-minutes: 2
        run: python3 -m unittest discover -s research/pdf-pagination-behavior-20261116 -p test_stock.py -v
      - name: Exact official stock runtime without source download or engine build
        timeout-minutes: 8
        run: python3 research/pdf-pagination-behavior-20261116/prepare_stock.py
      - name: Verify original package and reference bytes
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if dpkg-query --status milkup >/dev/null 2>&1; then echo 'Refusing existing installation'; exit 1; fi
          gh api repos/Auto-Plugin/milkup/actions/artifacts/14149947936/zip > "$RUNNER_TEMP/pagination-original-package.zip"
          gh api repos/Auto-Plugin/milkup/actions/artifacts/14153980570/zip > "$RUNNER_TEMP/pagination-original-reference.zip"
          python3 research/pdf-pagination-mechanism-20261116/native_probe.py assets --package "$RUNNER_TEMP/pagination-original-package.zip" --reference "$RUNNER_TEMP/pagination-original-reference.zip" --output "$RUNNER_TEMP/pagination-stock"
          dpkg-query -W libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core poppler-utils python3-fitz > "$RUNNER_TEMP/pagination-stock/runtime-versions.txt"
      - name: Install exact owned package for stock controls
        timeout-minutes: 2
        run: |
          set -euo pipefail
          package=("$RUNNER_TEMP"/pagination-stock/package/*.deb)
          test "${#package[@]}" = 1
          touch "$RUNNER_TEMP/pagination-stock/installation-owned-by-run"
          sudo dpkg --install "${package[0]}" > "$RUNNER_TEMP/pagination-stock/install.txt" 2>&1
      - name: Three independent original-output controls, retain all contract failures
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 550s xvfb-run -a -s '-screen 0 1400x1000x24' dbus-run-session -- python3 research/pdf-pagination-behavior-20261116/stock_probe.py --output "$RUNNER_TEMP/pagination-stock" 2>&1 | tee "$RUNNER_TEMP/pagination-stock/harness.txt"
      - name: Remove only owned test installation
        if: always()
        timeout-minutes: 2
        run: |
          if test -f "$RUNNER_TEMP/pagination-stock/installation-owned-by-run"; then
            sudo dpkg --remove milkup > "$RUNNER_TEMP/pagination-stock/uninstall.txt" 2>&1
            test ! -e /usr/bin/milkup-desktop
          fi
      - name: Preserve stock originals and failed contracts
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-stock-paper-control-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pagination-stock/
            !${{ runner.temp }}/pagination-stock/package/
            !${{ runner.temp }}/pagination-stock/xdg-*/
            ${{ runner.temp }}/milkup-stock-paper-control/evidence/
