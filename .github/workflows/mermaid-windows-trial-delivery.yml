name: Mermaid Windows installed test delivery

# User-authorized test installer and installed-product verification only.
# No Release, tag, main merge, runtime provisioning, or original-instance access.
on:
  push:
    branches: [dot/mermaid-stability-20261104]
  workflow_dispatch:
    inputs:
      accepted_source_run:
        description: Successful dual-account source acceptance run
        required: true
        type: string
        default: '41985364078'
      accepted_source_sha:
        description: Exact source commit tested by that run
        required: true
        type: string
        default: 'a22f8c35c4efc055c534feb907c4aa7add42ee33'

permissions:
  contents: read
  actions: read

concurrency:
  group: mermaid-rebuild-windows-compile
  queue: max
  cancel-in-progress: false

jobs:
  package:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/mermaid-stability-20261104' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false &&
        contains(github.event.head_commit.message, '[mermaid-windows-installer]')))
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify exact candidate, approved ancestor and official engine
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SOURCE_RUN: ${{ inputs.accepted_source_run || '41985364078' }}
          ACCEPTED_SOURCE_SHA: ${{ inputs.accepted_source_sha || 'a22f8c35c4efc055c534feb907c4aa7add42ee33' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = @(git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne $env:GITHUB_SHA) { throw 'Wrong source candidate' }
          if ($env:ACCEPTED_SOURCE_RUN -cnotmatch '^[0-9]+$' -or $env:ACCEPTED_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid exact source acceptance identity' }
          $sourceRun = (& gh api ('repos/Auto-Plugin/milkup/actions/runs/' + $env:ACCEPTED_SOURCE_RUN) | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $sourceRun.status -cne 'completed' -or $sourceRun.conclusion -cne 'success' -or
              $sourceRun.head_sha -cne $env:ACCEPTED_SOURCE_SHA -or
              $sourceRun.head_branch -cne 'dot/mermaid-stability-20261104' -or
              $sourceRun.path -cne '.github/workflows/mermaid-windows-account-compat.yml') { throw 'Exact dual-account source acceptance has not passed' }
          git merge-base --is-ancestor b139a9891a086685d7e0e9e85472a29a629f7a45 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate is outside accepted implementation' }
          git merge-base --is-ancestor $env:ACCEPTED_SOURCE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Accepted source is not an ancestor of this installer candidate' }
          git diff --exit-code $env:ACCEPTED_SOURCE_SHA HEAD -- apps/desktop/src-tauri/mermaid-engine apps/desktop/src-tauri/src apps/desktop/src packages/core/src packages/view-dom/src plugins/diagrams-worker
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed native, renderer or Diagrams implementation changed before packaging' }
          $dirty = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw 'Dirty candidate checkout' }
          if (Test-Path scripts/experiments/mermaid-fixed-prototype) { throw 'Prototype must not enter installer' }
          $engine = Get-Item apps/desktop/src-tauri/mermaid-engine/assets/mermaid-12.2.0.min.js
          if ($engine.Length -ne 5494801 -or (Get-FileHash $engine.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a8a6a6f805b074a8261a2825c86f99c8054acb3b35f50bb7e24a4f9f2c3c3b9f') { throw 'Official engine bytes changed' }
          node scripts/check-versions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Version metadata mismatch' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -cne '2.0.0-beta.10') { throw 'Wrong test version' }
          $evidence = Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence'
          New-Item -ItemType Directory -Path (Join-Path $evidence 'public-plugins') | Out-Null
          node tests/windows/capture-build-source-state.mjs $PWD checkout $env:GITHUB_SHA (Join-Path $evidence 'mermaid-source-checkout.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain original source state' }
          'CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'mermaid-trial-cargo-target') >> $env:GITHUB_ENV
      - name: Select locked build tools and validate packaging scripts
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@11.7.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
          rustup run 1.99.0 rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler unavailable' }
          foreach ($file in @('build-windows-mermaid-trial.ps1', 'run-windows-mermaid-product-e2e.ps1', 'verify-windows-app-manifest.ps1')) {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/ci/$file"), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $sevenZip = (Get-Command 7z -ErrorAction Stop | Select-Object -First 1).Source
          & $sevenZip i
          if ($LASTEXITCODE -ne 0) { throw 'Existing archive inspector unavailable' }
          node --test scripts/ci/verify-mermaid-source-acceptance.test.mjs scripts/ci/verify-nsis-image.test.mjs scripts/ci/inspect-mermaid-windows-dependencies.test.mjs tests/windows/stage-mermaid-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaging evidence regressions failed' }
      - name: Restore locked dependencies and stage the exact reviewed plugins
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile --config.manage-package-manager-versions=false
          if ($LASTEXITCODE -ne 0) { throw 'Locked workspace restore failed' }
          $mathDependencies = Join-Path $env:RUNNER_TEMP 'mermaid-trial-math-input'
          npm install --prefix $mathDependencies --ignore-scripts --no-audit --no-fund katex@0.19.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned KaTeX build input restore failed' }
          $katex = Join-Path $mathDependencies 'node_modules/katex'
          if ((Get-Content (Join-Path $katex 'package.json') -Raw | ConvertFrom-Json).version -cne '0.19.0') { throw 'Wrong KaTeX input' }
          $mathModules = Join-Path $PWD 'plugins/math/node_modules'
          New-Item -ItemType Directory -Force -Path $mathModules | Out-Null
          $katexLink = Join-Path $mathModules 'katex'
          if (Test-Path -LiteralPath $katexLink) { throw 'Unexpected existing KaTeX staging path' }
          New-Item -ItemType Junction -Path $katexLink -Target $katex | Out-Null
          $records = @(node scripts/ci/prepare-bundled-plugins.mjs)
          if ($LASTEXITCODE -ne 0) { throw 'Exact reviewed plugin staging failed' }
          $records | Write-Host
          $objects = @($records | ForEach-Object { $_ | ConvertFrom-Json })
          if ($objects.Count -ne 10) { throw 'Expected ten Windows plugins' }
          $objects | ConvertTo-Json -Depth 32 | Set-Content (Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence/public-plugins/staged-bundles.json') -Encoding utf8
          pnpm --filter @milkup/desktop typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Desktop type check failed' }
          node --test scripts/ci/prepare-mermaid-trial-payload.test.mjs tests/windows/mermaid-product-e2e.test.mjs tests/windows/verify-installed-binary.test.mjs tests/windows/mermaid-gui-regression.test.mjs tests/windows/mermaid-gui-startup.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Delivery verification regressions failed' }
          ./tests/windows/account-kind-wrapper.test.ps1
          ./tests/windows/installer-wrapper.test.ps1
          ./tests/windows/mermaid-gui-observer.test.ps1
          $ownedProcess = @(& pwsh -NoProfile -File scripts/ci/test-windows-mermaid-owned-process.ps1 2>&1)
          $ownedProcessExit = $LASTEXITCODE
          $ownedProcess | Write-Host
          $ownedProcess | Set-Content (Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence/owned-process-regression.log') -Encoding utf8
          if ($ownedProcessExit -ne 0) { throw 'Held-process installer regressions failed' }
          Push-Location plugins/diagrams-worker
          try {
            node ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts
            if ($LASTEXITCODE -ne 0) { throw 'Diagrams compiler/renderer regressions failed' }
            node --test scripts/package-seals.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed package-seal regressions failed' }
          } finally { Pop-Location }
      - name: Test private native contracts before packaging
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeTests = @(& cargo test --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --lib -- --test-threads=1 --nocapture 2>&1)
          $nativeTestsExit = $LASTEXITCODE
          $nativeTests | Write-Host
          $nativeTests | Set-Content (Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence/native-regression.log') -Encoding utf8
          if ($nativeTestsExit -ne 0) { throw 'Private engine regression tests failed' }
          node tests/windows/capture-build-source-state.mjs $PWD desktop-check $env:GITHUB_SHA (Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence/mermaid-source-desktop-check.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain source state' }
      - name: Build release NSIS and inspect exact engine and plugin payloads
        id: packaged
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SOURCE_RUN: ${{ inputs.accepted_source_run || '41985364078' }}
          ACCEPTED_SOURCE_SHA: ${{ inputs.accepted_source_sha || 'a22f8c35c4efc055c534feb907c4aa7add42ee33' }}
        run: |
          ./scripts/ci/build-windows-mermaid-trial.ps1 -AcceptedSourceRunId $env:ACCEPTED_SOURCE_RUN -AcceptedSourceSha $env:ACCEPTED_SOURCE_SHA -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'mermaid-trial-delivery')
      - name: Strict final source gate before installer execution
        id: source_gate
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence'
          if (-not (Test-Path -LiteralPath $evidence)) { throw 'Original source evidence unavailable' }
          node tests/windows/capture-build-source-state.mjs $PWD final $env:GITHUB_SHA (Join-Path $evidence 'mermaid-source-final.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retain final source state' }
          $head = @(git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne $env:GITHUB_SHA) { throw 'Source SHA changed during packaging' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source checkout' }
          $dirty | Write-Host
          git diff --no-ext-diff --no-textconv HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source diff' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Source checkout changed during packaging; never restore or relax the gate' }
      - name: Install and test the same release package under both fresh account kinds
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence'
          $record = Get-Content (Join-Path $evidence 'packaging-record.json') -Raw | ConvertFrom-Json
          $manifest = Join-Path $evidence 'installer-input.json'
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $failures = @()
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            try {
              ./scripts/ci/run-windows-mermaid-product-e2e.ps1 -Binary $record.compiledApplication.path -ExpectedBinarySha256 $record.compiledApplication.sha256 -Installer $record.installer.path -ExpectedInstallerSha256 $record.installer.sha256 -ExpectedVersion $record.version -PackageManifest $manifest -ExpectedPackageManifestSha256 $manifestHash -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "mermaid-trial-installed-evidence/$kind") -ExpectedCommit $env:GITHUB_SHA -ProductionAssetsConfirmed -AccountKind $kind
            } catch {
              $failures += "$kind : $($_.Exception.Message)"
              Write-Host "::error::$kind installed-product acceptance failed; original reports retained"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Verify installed GUI stability and close under both account kinds
        if: always() && steps.packaged.outcome == 'success' && steps.source_gate.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence'
          $record = Get-Content (Join-Path $evidence 'packaging-record.json') -Raw | ConvertFrom-Json
          $manifest = Join-Path $evidence 'installer-input.json'
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $failures = @()
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            try {
              ./scripts/ci/run-windows-mermaid-product-e2e.ps1 -HarnessMode gui-regression -FrontendBoundaryProbe -Binary $record.compiledApplication.path -ExpectedBinarySha256 $record.compiledApplication.sha256 -Installer $record.installer.path -ExpectedInstallerSha256 $record.installer.sha256 -ExpectedVersion $record.version -PackageManifest $manifest -ExpectedPackageManifestSha256 $manifestHash -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "mermaid-trial-gui-evidence/$kind") -ExpectedCommit $env:GITHUB_SHA -ProductionAssetsConfirmed -AccountKind $kind
            } catch {
              $failures += "$kind : $($_.Exception.Message)"
              Write-Host "::error::$kind installed GUI regression failed; original reports retained"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Retain bounded installed-product evidence with original outcomes
        id: installed_evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'mermaid-trial-installed-retained'
          New-Item -ItemType Directory -Path $staging | Out-Null
          $retained = 0
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            $directory = Join-Path $env:RUNNER_TEMP "mermaid-trial-installed-evidence/$kind"
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) { continue }
            foreach ($phase in @('checkout', 'desktop-check', 'final')) {
              $name = 'mermaid-source-' + $phase + '.json'
              Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "mermaid-trial-build-evidence/$name") -Destination (Join-Path $directory $name) -ErrorAction Stop
            }
            node tests/windows/stage-mermaid-evidence.mjs $directory (Join-Path $staging $kind) $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Installed evidence failed bounded provenance verification for $kind" }
            $retained++
          }
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            $directory = Join-Path $env:RUNNER_TEMP "mermaid-trial-gui-evidence/$kind"
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) { continue }
            node tests/windows/stage-mermaid-evidence.mjs $directory (Join-Path $staging "gui-$kind") $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Installed GUI evidence failed bounded provenance verification for $kind" }
            $retained++
          }
          if ($retained -eq 0) { exit 0 }
          "directory=$staging" >> $env:GITHUB_OUTPUT
          'ready=true' >> $env:GITHUB_OUTPUT
      - name: Finalize delivery only after installed UI and cleanup acceptance
        id: finalized
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/ci/prepare-mermaid-trial-payload.mjs finalize (Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence') (Join-Path $env:RUNNER_TEMP 'mermaid-trial-delivery') (Join-Path $env:RUNNER_TEMP 'mermaid-trial-installed-evidence') (Join-Path $env:RUNNER_TEMP 'mermaid-trial-gui-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Final installed-delivery verification failed' }
          'ready=true' >> $env:GITHUB_OUTPUT
      - name: Collect only approved packaging reports
        id: build_evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-evidence'
          $destination = Join-Path $env:RUNNER_TEMP 'mermaid-trial-build-retained'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $names = @('mermaid-source-checkout.json', 'mermaid-source-desktop-check.json', 'mermaid-source-final.json', 'nsis-image-proof.json', 'packaging-record.json', 'installer-input.json', 'packaged-production-binary-manifest.json', 'packaged-production-binary.manifest', 'public-plugins/staged-bundles.json', 'public-plugins/verification.json', 'mermaid-trial-preparation.json', 'mermaid-trial-finalization.json', 'windows-runtime-dependencies.json', 'windows-runtime-imports.log', 'owned-process-regression.log', 'native-regression.log')
          $retained = @()
          foreach ($name in $names) {
            $path = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $file = Get-Item -LiteralPath $path
            if (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 2MB) { throw 'Invalid packaging evidence input' }
            $target = Join-Path $destination ($name.Replace('/', '-'))
            Copy-Item -LiteralPath $path -Destination $target -ErrorAction Stop
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Packaging evidence copy mismatch' }
            $retained += [ordered]@{ name = [IO.Path]::GetFileName($target); bytes = $file.Length; sha256 = $hash }
          }
          [ordered]@{ candidateSha = $env:GITHUB_SHA; files = $retained; includesBinariesOrProfiles = $false } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $destination 'manifest.json') -Encoding utf8
          "directory=$destination" >> $env:GITHUB_OUTPUT
          'ready=true' >> $env:GITHUB_OUTPUT
      - name: Upload original installed-product evidence
        if: always() && steps.installed_evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-installed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.installed_evidence.outputs.directory }}/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false
      - name: Upload bounded packaging inspection evidence
        if: always() && steps.build_evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-installer-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build_evidence.outputs.directory }}/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false
      - name: Upload verified Windows test installer and plugins
        id: delivery
        if: success() && steps.finalized.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-2.0.0-beta.10-mermaid-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/mermaid-trial-delivery/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false
      - name: Record exact authenticated download location and retention
        if: steps.delivery.outputs.artifact-id != ''
        env:
          ARTIFACT_URL: ${{ steps.delivery.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.delivery.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.delivery.outputs.artifact-digest }}
        run: |
          "Test installer download (GitHub login required): $env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY
          "Artifact ID: $env:ARTIFACT_ID; ZIP SHA-256: $env:ARTIFACT_DIGEST; configured retention: 7 days. Verify actual expires_at before delivery." >> $env:GITHUB_STEP_SUMMARY
          'Unsigned beta.9 manual trial; installed pure-standard and non-elevated filtered-admin UI accepted. Historical IPC 995 remains unexplained; same application identity, no side-by-side/upgrade acceptance. Existing Evergreen required; no Runtime installer bundled/executed. No official Release or main merge.' >> $env:GITHUB_STEP_SUMMARY
