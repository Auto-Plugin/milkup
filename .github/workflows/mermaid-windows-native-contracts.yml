name: Mermaid Windows native contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-rebuild-windows-compile
  queue: max
  cancel-in-progress: false

jobs:
  native:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/mermaid-stability-20261104' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false && contains(github.event.head_commit.message, '[mermaid-native-contracts]')))
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated candidate and select pinned compiler
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Exact clean candidate required' }
          git merge-base --is-ancestor f26c379042e7fbc3ce4508e23e6ddf28e6b6463b HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Outside preserved beta9 baseline' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust setup failed' }
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
          'CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'mermaid-native-contracts-target') >> $env:GITHUB_ENV
      - name: Execute real Windows native library contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'mermaid-native-contracts.log'
          $lines = @(& cargo test --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --lib -- --test-threads=1 --nocapture 2>&1)
          $code = $LASTEXITCODE
          $lines | Write-Host
          $lines | Set-Content -LiteralPath $log -Encoding utf8
          if ((Get-Item -LiteralPath $log).Length -gt 2MB) { throw 'Unexpected native test log size' }
          [ordered]@{ schema = 1; candidateSha = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; exitCode = $code; sha256 = (Get-FileHash $log -Algorithm SHA256).Hash.ToLowerInvariant(); nativeWindowsTestsExecuted = $true; productGuiExecuted = $false; installedAcceptance = $false } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mermaid-native-contracts.json') -Encoding utf8
          if ($code -ne 0) { throw 'Native Windows contracts failed; original log retained' }
      - name: Preserve strict source identity
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Native validation changed the source checkout' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mermaid-native-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mermaid-native-contracts.log
            ${{ runner.temp }}/mermaid-native-contracts.json
          retention-days: 7
          if-no-files-found: warn
