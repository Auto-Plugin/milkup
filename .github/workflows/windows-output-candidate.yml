name: Windows output candidate native gates (no release)
on:
  push:
    branches: [dot/release-quality-integration-20261112]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-output-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-output:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/release-quality-integration-20261112' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false && contains(github.event.head_commit.message, '[output-native]')))
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Exact source and pinned tools
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Exact clean candidate required' }
          npm install --global pnpm@11.7.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
      - name: Locked frontend and exact bundled input
        run: |
          $ErrorActionPreference='Stop'
          pnpm install --frozen-lockfile --config.manage-package-manager-versions=false
          if ($LASTEXITCODE -ne 0) { throw 'Workspace restore failed' }
          $math=Join-Path $env:RUNNER_TEMP 'output-math-input'
          npm install --prefix $math --ignore-scripts --no-audit --no-fund katex@0.19.0
          if ($LASTEXITCODE -ne 0) { throw 'Math input failed' }
          New-Item -ItemType Directory -Force plugins/math/node_modules | Out-Null
          New-Item -ItemType Junction -Path plugins/math/node_modules/katex -Target (Join-Path $math 'node_modules/katex') | Out-Null
          node scripts/ci/prepare-bundled-plugins.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bundled input verification failed' }
          pnpm --filter @milkup/desktop build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend production build failed' }
      - name: Real Windows PDF, pipe lifecycle and native print cancellation
        run: ./tests/native/windows-pdf-backend.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-output-evidence')
      - name: Preserve original output evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-windows-output-${{ github.sha }}
          path: ${{ runner.temp }}/windows-output-evidence/
          retention-days: 7
          if-no-files-found: warn
