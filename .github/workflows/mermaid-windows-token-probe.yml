name: Mermaid Windows isolated token observation

# Test-only, fixed ignored Rust probes. No document, COM, WebView, Mermaid,
# installer, runtime provisioning, linked-token impersonation or process elevation.
# The shared launcher retains its existing low-token negative-write access check.
on:
  push:
    branches: [dot/mermaid-rebuild-20261103]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-rebuild-windows-compile
  queue: max
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/mermaid-rebuild-20261103' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false &&
        contains(github.event.head_commit.message, '[mermaid-token-probe]')))
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify the exact independent source
        run: |
          $ErrorActionPreference = 'Stop'
          $head = @(git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne $env:GITHUB_SHA) { throw 'Wrong probe candidate' }
          git merge-base --is-ancestor 1f64a10fa6c7c86488ccca31fa90be221c86ca38 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Probe is outside the observed failed candidate' }
          if (git status --porcelain) { throw 'Dirty probe checkout' }
          $evidence = Join-Path $env:RUNNER_TEMP 'mermaid-token-observation'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          node tests/windows/capture-build-source-state.mjs $PWD checkout $env:GITHUB_SHA (Join-Path $evidence 'source-checkout.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve original source state' }
          'CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'mermaid-token-probe-cargo') >> $env:GITHUB_ENV
      - name: Verify the fixed diagnostic wrapper
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/windows/token-probe-wrapper.test.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'mermaid-token-observation/wrapper-regressions.json')
      - name: Build only the private test executable with the locked compiler
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Locked Rust setup failed' }
          $env:RUSTUP_TOOLCHAIN = '1.99.0'
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
          $records = @(cargo test --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --lib --no-run --message-format=json)
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { throw 'Private token probe compilation failed' }
          $messages = @($records | ForEach-Object { $_ | ConvertFrom-Json })
          $executables = @($messages | Where-Object { $_.reason -eq 'compiler-artifact' } | Where-Object { $_.profile.test -eq $true -and $_.target.name -ceq 'milkup_mermaid_engine' -and $_.executable })
          if ($executables.Count -ne 1) { throw 'Need exactly one actual private library test executable' }
          $binary = Get-Item -LiteralPath $executables[0].executable
          if ($binary.Attributes -band [IO.FileAttributes]::ReparsePoint -or $binary.Length -gt 64MB -or $binary.Extension -cne '.exe') { throw 'Invalid probe image' }
          $prefix = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR).TrimEnd('\') + '\'
          if (-not $binary.FullName.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or $binary.FullName.Contains("`n") -or $binary.FullName.Contains("`r")) { throw 'Unexpected probe build output path' }
          $hash = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{ candidateSha = $env:GITHUB_SHA; executable = $binary.FullName; bytes = $binary.Length; sha256 = $hash; testOnly = $true; desktopBuilt = $false; documentRendering = $false } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'mermaid-token-observation/probe-build-record.json') -Encoding utf8
          "MILKUP_TOKEN_PROBE_BINARY=$($binary.FullName)" >> $env:GITHUB_ENV
          "MILKUP_TOKEN_PROBE_SHA256=$hash" >> $env:GITHUB_ENV
          cargo test --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Private crate regressions failed' }
      - name: Preserve the strict clean-source gate
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/windows/capture-build-source-state.mjs $PWD pre-probe $env:GITHUB_SHA (Join-Path $env:RUNNER_TEMP 'mermaid-token-observation/source-pre-probe.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve pre-probe source' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw 'Source changed during private probe build' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Source index changed' }
      - name: Observe fixed probes in both exact fresh account kinds
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            try {
              ./scripts/ci/run-windows-mermaid-token-probe.ps1 -ProbeBinary $env:MILKUP_TOKEN_PROBE_BINARY -ExpectedProbeExeSha256 $env:MILKUP_TOKEN_PROBE_SHA256 -ExpectedCommit $env:GITHUB_SHA -AccountKind $kind -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "mermaid-token-observation/$kind")
            } catch {
              $failures += "$kind : $($_.Exception.Message)"
              Write-Host "::error::$kind token observation incomplete; retain original failure"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Collect only bounded original observation evidence
        id: evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'mermaid-token-observation'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { exit 0 }
          node tests/windows/capture-build-source-state.mjs $PWD final $env:GITHUB_SHA (Join-Path $source 'source-final.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve final source' }
          $destination = Join-Path $env:RUNNER_TEMP 'mermaid-token-observation-retained'
          New-Item -ItemType Directory -Path $destination | Out-Null
          # Exact child names are reviewed alongside the fixed wrapper below.
          $rootNames = @('source-checkout.json', 'source-pre-probe.json', 'source-final.json', 'probe-build-record.json', 'wrapper-regressions.json')
          $childNames = @('windows-mermaid-token-probe-audit.json', 'token-probe-result.json', 'token-probe-stdout.log', 'token-probe-stderr.log', 'token-probe-context.json', 'token-probe-child-result.json', 'token-probe-evidence-files.json')
          $allowed = @($rootNames)
          foreach ($kind in @('pure-standard', 'filtered-admin')) { foreach ($name in $childNames) { $allowed += "$kind/$name" } }
          $retained = @()
          foreach ($name in $allowed) {
            $path = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $file = Get-Item -LiteralPath $path
            if ($file.Attributes -band [IO.FileAttributes]::ReparsePoint -or $file.Length -gt 2MB) { throw 'Invalid observation evidence file' }
            $target = Join-Path $destination $name
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target -ErrorAction Stop
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Observation copy changed bytes' }
            $retained += [ordered]@{ name = $name; bytes = $file.Length; sha256 = $hash }
          }
          [ordered]@{ candidateSha = $env:GITHUB_SHA; files = $retained; scope = 'Fixed trusted token observations only; no document or browser execution' } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $destination 'manifest.json') -Encoding utf8
          "directory=$destination" >> $env:GITHUB_OUTPUT
          'ready=true' >> $env:GITHUB_OUTPUT
      - name: Upload original diagnostic reports
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-token-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false
