name: Isolated Linux native acceptance (no release)
on:
  push:
    branches: [dot/linux-native-acceptance-20261114]
permissions:
  contents: read
concurrency:
  group: linux-native-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Auto-Plugin/milkup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only actual runner capabilities
        run: python3 scripts/ci/probe-linux-native.py "$RUNNER_TEMP/linux-native-evidence"
      - name: Restore official GUI runtime and project build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev pkg-config webkit2gtk-driver xdotool x11-utils poppler-utils
      - name: Actual ordinary-user sandbox-enabled WebKit navigation
        run: |
          test "$(id -u)" != 0
          test -z "${WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS:-}"
          python3 scripts/ci/probe-linux-native.py "$RUNNER_TEMP/linux-native-evidence/after-gui-dependencies"
          cc scripts/ci/linux-webkit-preflight.c -o "$RUNNER_TEMP/milkup-webkit-preflight" $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0)
          set +e
          timeout --signal=TERM --kill-after=5s 40s xvfb-run -a dbus-run-session -- "$RUNNER_TEMP/milkup-webkit-preflight" > "$RUNNER_TEMP/linux-native-evidence/webkit-preflight.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/linux-native-evidence/webkit-preflight-exit.txt"
          cat "$RUNNER_TEMP/linux-native-evidence/webkit-preflight.log"
          exit "$result"
      - name: Retain actual capabilities including missing prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-linux-native-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-native-evidence/
          retention-days: 7
          if-no-files-found: error
