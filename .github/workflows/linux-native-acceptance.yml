name: Table break mechanism probe (no application build)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact mechanism probe SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: table-break-mechanism
  cancel-in-progress: false
jobs:
  mechanism:
    if: github.repository == 'Auto-Plugin/milkup'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source and official default runtime
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(id -u)" != 0
          test -z "${WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS:-}"
          mkdir -p "$RUNNER_TEMP/table-break-evidence"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config xvfb xauth fonts-noto-cjk poppler-utils python3-lxml python3-pil python3-fitz
          dpkg-query -W libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 fonts-noto-cjk poppler-utils python3-fitz > "$RUNNER_TEMP/table-break-evidence/runtime-versions.txt"
      - name: Structural and negative measurement contracts
        run: |
          python3 research/table-break-mechanism-20261115/test_probe.py
          python3 research/table-break-mechanism-20261115/probe.py preflight "$RUNNER_TEMP/table-break-evidence"
      - name: One bounded system engine experiment
        timeout-minutes: 12
        run: |
          timeout --signal=TERM --kill-after=10s 660s python3 research/table-break-mechanism-20261115/probe.py native "$RUNNER_TEMP/table-break-evidence" 2>&1 | tee "$RUNNER_TEMP/table-break-evidence/native.log"
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-table-break-${{ github.run_id }}
          path: ${{ runner.temp }}/table-break-evidence/
          retention-days: 7
          if-no-files-found: error
