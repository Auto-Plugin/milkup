name: Isolated Linux alternative prerequisite check (no release)
on:
  push:
    branches: [dot/linux-native-acceptance-20261114]
permissions:
  contents: read
concurrency:
  group: linux-native-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Auto-Plugin/milkup'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PROBE_RUNNER: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only actual runner capabilities
        run: python3 scripts/ci/probe-linux-native.py "$RUNNER_TEMP/linux-native-evidence"
      - name: Refresh signed package metadata without changing installed packages
        run: sudo apt-get update
      - name: Exact original b877 ABI and required package availability gate
        id: compat
        run: python3 scripts/ci/linux-alternative-compatibility.py "$RUNNER_TEMP/linux-native-evidence"
      - name: Official GUI dependencies only on compatible system
        if: steps.compat.outputs.eligible == 'true'
        run: sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config xvfb xauth
      - name: Read-only native GTK printer enumeration
        if: steps.compat.outputs.eligible == 'true'
        run: |
          test "$(id -u)" != 0
          cc scripts/ci/linux-gtk-printers.c -o "$RUNNER_TEMP/milkup-gtk-printers" $(pkg-config --cflags --libs gtk+-unix-print-3.0)
          timeout --signal=TERM --kill-after=5s 30s xvfb-run -a dbus-run-session -- "$RUNNER_TEMP/milkup-gtk-printers" > "$RUNNER_TEMP/linux-native-evidence/gtk-printers.jsonl" 2> "$RUNNER_TEMP/linux-native-evidence/gtk-printers.stderr.txt"
          cat "$RUNNER_TEMP/linux-native-evidence/gtk-printers.jsonl"
      - name: One actual ordinary-user sandbox-enabled WebKit attempt
        if: always() && steps.compat.outputs.eligible == 'true'
        run: |
          test "$(id -u)" != 0
          test -z "${WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS:-}"
          python3 scripts/ci/probe-linux-native.py "$RUNNER_TEMP/linux-native-evidence/after-gui-dependencies"
          cc scripts/ci/linux-webkit-preflight.c -o "$RUNNER_TEMP/milkup-webkit-preflight" $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0)
          set +e
          timeout --signal=TERM --kill-after=5s 40s xvfb-run -a dbus-run-session -- "$RUNNER_TEMP/milkup-webkit-preflight" > "$RUNNER_TEMP/linux-native-evidence/webkit-preflight.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/linux-native-evidence/webkit-preflight-exit.txt"
          cat "$RUNNER_TEMP/linux-native-evidence/webkit-preflight.log"
          exit "$result"
      - name: Preserve evidence including stop conditions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-linux-alternative-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-native-evidence/
          retention-days: 7
          if-no-files-found: error
