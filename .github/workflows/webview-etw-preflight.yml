name: Isolated WebView ETW capability preflight
on:
  push:
    branches: [dot/webview-etw-preflight-20261113]
    paths:
      - .github/workflows/webview-etw-preflight.yml
      - scripts/ci/probe-webview-etw.ps1
      - tests/native/fixtures/WebView2_CPU.wprp
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: milkup-etw-preflight
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Auto-Plugin/milkup' && github.ref == 'refs/heads/dot/webview-etw-preflight-20261113'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify signed recorder and bounded disposable recording
        shell: pwsh
        run: scripts/ci/probe-webview-etw.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'milkup-etw-safe-evidence')
      - name: Keep only sanitized capability summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webview-etw-capabilities-${{ github.sha }}
          path: ${{ runner.temp }}/milkup-etw-safe-evidence/capabilities.json
          if-no-files-found: error
          retention-days: 7
