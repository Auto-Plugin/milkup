name: Mermaid frontend Windows account acceptance

# Explicit frontend candidate: same complete two-account product and GUI suite.
# Native rendering records are forbidden; per-frame native rejection/release is required.
# Legacy native-engine unit checks below are regression-only, not frontend evidence.
# Delivered beta.8 artifacts remain unchanged; no elevation fallback or token editing.
# No installer, Runtime provisioning or existing ACL/UAC changes.
# Upload only reviewed self-authored evidence; never binaries or profiles.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-rebuild-windows-compile
  queue: max
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      (github.ref == 'refs/heads/dot/mermaid-rebuild-20261103' || github.ref == 'refs/heads/dot/mermaid-stability-20261104' || github.ref == 'refs/heads/dot/mermaid-plugin-modes-20261109' || github.ref == 'refs/heads/dot/release-quality-integration-20261112' || github.ref == 'refs/heads/dot/startup-empty-anchor-20261112') &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false &&
        contains(github.event.head_commit.message, '[mermaid-frontend-e2e]')))
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact new candidate and engine bytes
        run: |
          $ErrorActionPreference = 'Stop'
          $head = @(git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          git merge-base --is-ancestor 1494852518fb449191c839ef8573ba548bbefaa3 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate is outside the reviewed rebuild baseline' }
          if (git status --porcelain) { throw 'Dirty candidate checkout' }
          if (Test-Path scripts/experiments/mermaid-fixed-prototype) { throw 'Historical prototype must not enter the product build' }
          $engine = Get-Item apps/desktop/src-tauri/mermaid-engine/assets/mermaid-12.2.0.min.js
          if ($engine.Length -ne 5494801 -or (Get-FileHash $engine.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a8a6a6f805b074a8261a2825c86f99c8054acb3b35f50bb7e24a4f9f2c3c3b9f') { throw 'Pinned official engine mismatch' }
          'CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'mermaid-account-cargo-target') >> $env:GITHUB_ENV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Record original generated-schema bytes and newline attributes
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/windows/capture-build-source-state.mjs $PWD checkout $env:GITHUB_SHA (Join-Path $env:RUNNER_TEMP 'mermaid-source-checkout.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record original schema bytes' }
      - name: Select pinned source-build tools
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@11.7.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler setup failed' }
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
          rustup run 1.99.0 rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler unavailable' }
          node --version
          pnpm --version
      - name: Restore locked workspace and stage reviewed product plugins
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile --config.manage-package-manager-versions=false
          if ($LASTEXITCODE -ne 0) { throw 'Locked workspace restore failed' }
          # The frozen old public SDK is intentionally not fetched from npm.
          # Math's build-only KaTeX input is staged separately, without modifying
          # any product/plugin manifest or lockfile or weakening archive seals.
          $mathDependencies = Join-Path $env:RUNNER_TEMP 'mermaid-rebuild-math-input'
          npm install --prefix $mathDependencies --ignore-scripts --no-audit --no-fund katex@0.19.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned KaTeX build input restore failed' }
          $katex = Join-Path $mathDependencies 'node_modules/katex'
          if ((Get-Content (Join-Path $katex 'package.json') -Raw | ConvertFrom-Json).version -cne '0.19.0') { throw 'Wrong KaTeX build input' }
          $mathModules = Join-Path $PWD 'plugins/math/node_modules'
          New-Item -ItemType Directory -Force -Path $mathModules | Out-Null
          $katexLink = Join-Path $mathModules 'katex'
          if (Test-Path -LiteralPath $katexLink) { throw 'Unexpected preexisting math build input' }
          New-Item -ItemType Junction -Path $katexLink -Target $katex | Out-Null
          node scripts/check-versions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Product version mismatch' }
          node scripts/ci/prepare-bundled-plugins.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed bundled-plugin staging failed' }
          pnpm --filter @milkup/desktop build
          if ($LASTEXITCODE -ne 0) { throw 'Production frontend build failed' }
      - name: Validate account fixtures and strict close evidence
        run: |
          $ErrorActionPreference = 'Stop'
          node --test tests/windows/mermaid-observer-finalization.test.mjs tests/windows/mermaid-frontend-contract.test.mjs tests/windows/mermaid-product-e2e.test.mjs scripts/ci/prepare-mermaid-trial-payload.test.mjs tests/windows/stage-mermaid-evidence.test.mjs tests/windows/mermaid-gui-regression.test.mjs tests/windows/mermaid-gui-startup.test.mjs scripts/ci/read-linked-gui-plugin-inventory.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Account/close/payload evidence regression failed' }
          ./tests/windows/account-kind-wrapper.test.ps1
          ./tests/windows/installer-wrapper.test.ps1
          ./tests/windows/mermaid-gui-observer.test.ps1
      - name: Check and test private fixed-engine Rust contracts
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Private engine Windows type check failed' }
          cargo test --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Private engine Windows unit tests failed' }
      - name: Prove a genuinely elevated host is rejected before native resource creation
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          foreach ($machineRoot in @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ } | Select-Object -Unique) {
            $root = Join-Path $machineRoot 'Microsoft/EdgeWebView/Application'
            if (-not (Test-Path -LiteralPath $root -PathType Container)) { continue }
            foreach ($directory in Get-ChildItem -LiteralPath $root -Directory) {
              if ($directory.Name -cnotmatch '^\d+\.\d+\.\d+\.\d+$') { continue }
              if (Test-Path -LiteralPath (Join-Path $directory.FullName 'msedgewebview2.exe') -PathType Leaf) { $candidates += $directory }
            }
          }
          if (-not $candidates.Count) { throw 'Existing Evergreen required; never install a runtime for the rejection test' }
          $selected = @($candidates | Sort-Object { [version]$_.Name })[-1]
          $env:MILKUP_MERMAID_ELEVATED_REJECTION = '1'
          $env:MILKUP_MERMAID_ELEVATED_REJECTION_RUNTIME = $selected.FullName
          try {
            $output = @(cargo test --locked --manifest-path apps/desktop/src-tauri/mermaid-engine/Cargo.toml --lib launcher::tests::elevated_host_is_rejected_before_native_resources -- --exact --ignored --nocapture 2>&1)
            $testExit = $LASTEXITCODE
            $output | Write-Host
            $output | Set-Content (Join-Path $env:RUNNER_TEMP 'mermaid-elevated-rejection.log') -Encoding utf8
            if ($testExit -ne 0 -or (($output -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed')) { throw 'Actual elevated-host rejection was not proven by exactly one passing test' }
          } finally {
            Remove-Item Env:MILKUP_MERMAID_ELEVATED_REJECTION -ErrorAction SilentlyContinue
            Remove-Item Env:MILKUP_MERMAID_ELEVATED_REJECTION_RUNTIME -ErrorAction SilentlyContinue
          }
      - name: Check and test desktop Rust integration
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Windows type check failed' }
          node tests/windows/capture-build-source-state.mjs $PWD desktop-check $env:GITHUB_SHA (Join-Path $env:RUNNER_TEMP 'mermaid-source-desktop-check.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record generated schema bytes after desktop check' }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Windows library tests failed' }
      - name: Link desktop with embedded production assets without executing it
        id: linked
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --bin milkup-desktop --features tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Desktop production-asset binary link failed' }
          $binary = Get-Item (Join-Path $env:CARGO_TARGET_DIR 'debug/milkup-desktop.exe')
          [ordered]@{
            candidateSha = $env:GITHUB_SHA
            platform = 'Windows x86_64'
            profile = 'dev-with-production-custom-protocol-assets'
            binaryBytes = $binary.Length
            binarySha256 = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            engineVersion = '12.2.0'
            engineSha256 = 'a8a6a6f805b074a8261a2825c86f99c8054acb3b35f50bb7e24a4f9f2c3c3b9f'
            nativeMermaidRenderingExecuted = $false
            windowsPixelsAccepted = $false
            installerBuilt = $false
            artifactsUploaded = $false
          } | ConvertTo-Json -Depth 4 | Write-Host
      - name: Record source state and acceptance boundary
        id: source_gate
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/windows/capture-build-source-state.mjs $PWD final $env:GITHUB_SHA (Join-Path $env:RUNNER_TEMP 'mermaid-source-final.json')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record final schema bytes' }
          # Diagnose using the existing schema classifier, but keep the stricter
          # original dirty-tree failure until actual Windows drift is reviewed.
          # Never restore source or classify an unseen first-run difference as safe.
          $dirty = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read exact source status' }
          Write-Host '::group::exact-source-status'
          $dirty | Write-Host
          git diff --stat HEAD
          git diff --no-ext-diff --no-textconv HEAD
          $changed = @(& git -c core.quotepath=false diff --name-only HEAD)
          $untracked = @(& git -c core.quotepath=false ls-files --others --exclude-standard)
          $paths = @($changed + $untracked) | Sort-Object -Unique
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $file = Get-Item -LiteralPath $path
              [ordered]@{ path = $path; bytes = $file.Length; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json -Compress | Write-Host
            } else {
              [ordered]@{ path = $path; missingOrNotFile = $true } | ConvertTo-Json -Compress | Write-Host
            }
          }
          Write-Host '::endgroup::'
          $proof = Join-Path $env:RUNNER_TEMP 'mermaid-rebuild-source-build-tree.json'
          node tests/windows/verify-build-tree.mjs $PWD $proof
          $treeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $proof) { Get-Content -LiteralPath $proof -Raw | Write-Host }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified the source index' }
          if ($treeExit -ne 0) { throw 'Build changed a source, lockfile or unexpected output; see exact preserved status' }
          if ($dirty.Count -ne 0) { throw 'Build tree remains dirty; exact changes are retained for review, including known generated schemas' }
          'Pre-launch source gate: dirty generated files still fail pending explicit diagnosis/review. Product UI acceptance has not run at this step.' >> $env:GITHUB_STEP_SUMMARY
      - name: Run distinct pure-standard and filtered-admin product acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:CARGO_TARGET_DIR 'debug/milkup-desktop.exe'
          $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $failures = @()
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            try {
              ./scripts/ci/run-windows-mermaid-product-e2e.ps1 -RendererMode frontend -Binary $binary -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "mermaid-account-$kind") -ExpectedCommit $env:GITHUB_SHA -ExpectedBinarySha256 $hash -ProductionAssetsConfirmed -AccountKind $kind
            } catch {
              $failures += "$kind : $($_.Exception.Message)"
              Write-Host "::error::$kind failed; original reports are retained"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Stage completed product evidence before GUI regression
        id: product_evidence
        if: always() && steps.linked.outcome == 'success' && steps.source_gate.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $retained = Join-Path $env:RUNNER_TEMP 'mermaid-product-retained-early'
          New-Item -ItemType Directory -Path $retained | Out-Null
          $count = 0
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            $directory = Join-Path $env:RUNNER_TEMP "mermaid-account-$kind"
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) { continue }
            foreach ($phase in @('checkout', 'desktop-check', 'final')) {
              $name = 'mermaid-source-' + $phase + '.json'
              Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Destination (Join-Path $directory $name) -ErrorAction Stop
            }
            node tests/windows/stage-mermaid-evidence.mjs $directory (Join-Path $retained $kind) $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Early product evidence closed-name/type/hash review failed for $kind" }
            $count++
          }
          if ($count -gt 0) {
            "directory=$retained" >> $env:GITHUB_OUTPUT
            'ready=true' >> $env:GITHUB_OUTPUT
          }
      - name: Retain product evidence without waiting for GUI completion
        if: always() && steps.product_evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-product-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.product_evidence.outputs.directory }}/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false
      - name: Run independent GUI regression under both account kinds
        if: always() && steps.linked.outcome == 'success' && steps.source_gate.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:CARGO_TARGET_DIR 'debug/milkup-desktop.exe'
          $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $failures = @()
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            try {
              ./scripts/ci/run-windows-mermaid-product-e2e.ps1 -HarnessMode gui-regression -RendererMode frontend -Binary $binary -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "mermaid-gui-$kind") -ExpectedCommit $env:GITHUB_SHA -ExpectedBinarySha256 $hash -ProductionAssetsConfirmed -AccountKind $kind
            } catch {
              $failures += "$kind : $($_.Exception.Message)"
              Write-Host "::error::$kind GUI regression failed; original reports are retained"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Stage each account's original evidence independently
        id: evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $retained = Join-Path $env:RUNNER_TEMP 'mermaid-account-retained'
          New-Item -ItemType Directory -Path $retained | Out-Null
          $count = 0
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            $directory = Join-Path $env:RUNNER_TEMP "mermaid-account-$kind"
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) { continue }
            foreach ($phase in @('checkout', 'desktop-check', 'final')) {
              $name = 'mermaid-source-' + $phase + '.json'
              Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Destination (Join-Path $directory $name) -ErrorAction Stop
            }
            node tests/windows/stage-mermaid-evidence.mjs $directory (Join-Path $retained $kind) $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Evidence closed-name/type/hash review failed for $kind" }
            $count++
          }
          foreach ($kind in @('pure-standard', 'filtered-admin')) {
            $directory = Join-Path $env:RUNNER_TEMP "mermaid-gui-$kind"
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) { continue }
            node tests/windows/stage-mermaid-evidence.mjs $directory (Join-Path $retained "gui-$kind") $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "GUI evidence closed-name/type/hash review failed for $kind" }
            $count++
          }
          $rejectionLog = Join-Path $env:RUNNER_TEMP 'mermaid-elevated-rejection.log'
          if (Test-Path -LiteralPath $rejectionLog -PathType Leaf) {
            if ((Get-Item -LiteralPath $rejectionLog).Length -gt 2MB) { throw 'Elevated-rejection evidence exceeds budget' }
            Copy-Item -LiteralPath $rejectionLog -Destination (Join-Path $retained 'mermaid-elevated-rejection.log')
            $count++
          }
          if ($count -eq 0) { exit 0 }
          "directory=$retained" >> $env:GITHUB_OUTPUT
          'ready=true' >> $env:GITHUB_OUTPUT
          'Account kinds retain separate original token, PNG, task and cleanup evidence. A blocked or elevated token is never relabeled filtered-admin. No installer, runtime provisioning, original-instance access, Release or main merge.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain bounded original account-comparison evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-account-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          include-hidden-files: false
