name: Windows v2 catalog source checks

on:
  push:
    branches:
      - dot/milkup-v2-product-phase6-plugin-lifecycle
      - dot/milkup-v2-product-phase8-readiness
    paths:
      - .github/workflows/v2-windows-catalog-check.yml
      - apps/desktop/src-tauri/src/plugin_catalog*.rs
      - tests/native/catalog-core/**
      - apps/**
      - packages/**
      - plugins/**
      - vendor/**
      - scripts/**
      - tests/ci/**
      - release/bundled-plugins.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .gitattributes

permissions:
  contents: read

concurrency:
  group: windows-v2-catalog-source-check
  cancel-in-progress: false

jobs:
  catalog:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/milkup-v2-product-phase6-plugin-lifecycle' &&
      github.event.repository.private == false &&
      github.event.deleted == false &&
      contains(github.event.head_commit.message, '[windows-catalog-check]')
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/src-tauri/src
            tests/native/catalog-core
            .github/workflows/v2-windows-catalog-check.yml
      - name: Verify exact source and public standard-runner scope
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          git merge-base --is-ancestor 4e0d305bab563e3fc58aa97bb18115b6bf8f69d6 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected baseline' }
          if (git status --porcelain) { throw 'Dirty checkout' }
          'Source tests only: no Tauri/WebView2, installer, cache, artifact or Release.'
      - name: Select pinned Rust compiler
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler setup failed' }
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
      - name: Reproduce unsupported Windows baseline as a runtime failure
        run: |
          ./tests/native/catalog-core/run-windows-baseline.ps1
      - name: Compile and run native catalog contracts
        run: |
          ./tests/native/catalog-core/run-windows.ps1 -TargetDirectory "$env:RUNNER_TEMP/catalog-target"
      - name: Record validation boundary in logs
        if: always()
        run: |
          'Windows catalog source tests only. No desktop WebView, installer, arbitrary power-loss, macOS or sidecar activation acceptance.' >> $env:GITHUB_STEP_SUMMARY

  desktop-source:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/milkup-v2-product-phase8-readiness' &&
      github.event.repository.private == false &&
      github.event.deleted == false &&
      contains(github.event.head_commit.message, '[windows-desktop-source-check]')
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact P8 source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          git merge-base --is-ancestor a4d44e680478d7894450f30f3d533dc1c3131974 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected P8 baseline' }
          if (git status --porcelain) { throw 'Dirty checkout' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Select pinned development tools
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@11.7.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler setup failed' }
          'RUSTUP_TOOLCHAIN=1.99.0' >> $env:GITHUB_ENV
      - name: Check workspace, independent plugins and full desktop
        run: |
          ./scripts/ci/check-windows-desktop-source.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/p8-desktop-source"
      - name: Record source-validation boundary
        if: always()
        run: |
          'P8 source validation only: full desktop compiler/linker and library tests are separate phases. No installed-app, GUI, Runtime provisioning or delivery acceptance. Ten Worker plugin builds remain legacy/non-frozen; diagrams retains its reviewed frozen SDK.' >> $env:GITHUB_STEP_SUMMARY
          foreach ($name in @('source.json', 'phases.json', 'rust-test-result.json', 'production-binary-manifest.json', 'public-plugins/staged-bundles.json')) {
            $proof = Join-Path "$env:RUNNER_TEMP/p8-desktop-source" $name
            if (Test-Path $proof) {
              Write-Host "::group::$name"
              Get-Content $proof | Write-Host
              Write-Host '::endgroup::'
            }
          }
