name: Isolated remaining release-gap capabilities (no release)
on:
  workflow_dispatch:
    inputs:
      task:
        description: Explicit capability probe or exact-source native input test package
        type: choice
        default: capabilities
        options:
          [
            capabilities,
            build-native-input,
            build-cross-version-target,
            native-input-accept,
            signed-recovery-accept,
            cross-version-accept,
            build-in-app-update-fixture,
            in-app-update-accept,
          ]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-gap-capabilities-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-capabilities:
    if: inputs.task == 'capabilities'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/probe-windows-release-gaps.ps1
            /scripts/ci/windows-pinyin-control.cpp
      - name: Observe native prerequisites without changing machine policy
        shell: pwsh
        run: ./scripts/ci/probe-windows-release-gaps.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/gap-capabilities"
      - name: Compile and run owned native Pinyin control
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Existing official C++ toolchain unavailable' }
          $out="$env:RUNNER_TEMP/gap-capabilities"
          $command='call "'+$vs+'\VC\Auxiliary\Build\vcvars64.bat" && cl /nologo /W4 /EHsc /std:c++17 scripts\ci\windows-pinyin-control.cpp /Fe:"'+$out+'\pinyin-control.exe" /Fo:"'+$out+'\pinyin-control.obj" /link ole32.lib uuid.lib user32.lib imm32.lib'
          cmd /d /c $command 2>&1 | Tee-Object "$out/compile.txt"
          if ($LASTEXITCODE) { throw 'Native control compile failed' }
          & "$out/pinyin-control.exe" 2>&1 | Tee-Object "$out/pinyin-control.txt"
          $code=$LASTEXITCODE
          Remove-Item "$out/pinyin-control.exe","$out/pinyin-control.obj" -ErrorAction SilentlyContinue
          if ($code) { throw "Native control not established: $code (not a Milkup result)" }
      - name: Retain exact observations including unavailable capabilities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gap-capabilities-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gap-capabilities/
          retention-days: 7
          if-no-files-found: error
  package:
    if: inputs.task == 'build-native-input' || inputs.task == 'build-cross-version-target'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      BASELINE_SHA: ${{ inputs.task == 'build-cross-version-target' && '5fd33f2b63de2755268af6d669b0f4b3b1f21b96' || 'b877746f5dfd236dfc13f718ed23d837b8e4f89d' }}
      BUILD_SCOPE: ${{ inputs.task }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Exact unchanged source and locked build tools
        run: |
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git status --porcelain)"
          npm install --global pnpm@11.7.0 --ignore-scripts
          rustup toolchain install 1.99.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.99.0' >> "$GITHUB_ENV"
      - name: Restore locked workspace and reviewed math input
        run: |
          pnpm install --frozen-lockfile --config.manage-package-manager-versions=false
          npm install --prefix "$RUNNER_TEMP/milkup-math-input" --ignore-scripts --no-audit --no-fund katex@0.19.0
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';fs.mkdirSync('plugins/math/node_modules',{recursive:true});fs.symlinkSync(path.join(process.env.RUNNER_TEMP,'milkup-math-input/node_modules/katex'),'plugins/math/node_modules/katex','junction');"
      - name: Preserve source and release contracts
        run: |
          node scripts/check-versions.mjs
          node --test scripts/release/distribution.test.mjs scripts/release/recovery.test.mjs scripts/check-updater-vendor.test.mjs
          node scripts/release/update-readiness.mjs --candidate
          pnpm --filter @milkup/desktop typecheck
      - name: Pinned native packaging tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $evidence=Join-Path $env:RUNNER_TEMP 'distribution-tools'
          New-Item -ItemType Directory $evidence|Out-Null
          ./scripts/ci/prepare-windows-nsis-tools.ps1 -EvidenceDirectory $evidence
      - name: Build exact standard package for the explicitly selected acceptance
        run: node scripts/release/build-candidate.mjs windows-standard "$RUNNER_TEMP/milkup-candidate" "$BASELINE_SHA"
      - name: Verify candidate identity and record original-byte comparison
        run: |
          node scripts/release/verify-candidate.mjs "$RUNNER_TEMP/milkup-candidate/deliverable" "$BASELINE_SHA" windows-standard
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';const p=path.join(process.env.RUNNER_TEMP,'milkup-candidate/deliverable'),m=JSON.parse(fs.readFileSync(path.join(p,'manifest.json')));const original='605a428bd3f985e82854ead0f6f24026780449df0402257793ba474f8a45a425';fs.writeFileSync(path.join(p,'native-input-provenance.json'),JSON.stringify({sourceSha:process.env.BASELINE_SHA,harnessSha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,originalSha256:original,newManifest:m,scope:process.env.BUILD_SCOPE==='build-cross-version-target'?'VERSION-ONLY TEST FIXTURE; not a beta.11 release; cross-version installation and recovery not yet executed':'New exact-source build for native input acceptance; no installed IME/DPI result yet; preserved original package not replaced'},null,2));"
      - name: Retain new unsigned test bytes, never a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.task == 'build-cross-version-target' && 'milkup-cross-version-test-fixture' || 'milkup-b877-native-input-candidate' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/milkup-candidate/deliverable/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  in-app-fixture:
    if: inputs.task == 'build-in-app-update-fixture'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Locked tools and unchanged source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          npm install --global pnpm@11.7.0 --ignore-scripts
          rustup toolchain install 1.99.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.99.0' >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/in-app-target" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile --config.manage-package-manager-versions=false
          npm install --prefix "$RUNNER_TEMP/milkup-math-input" --ignore-scripts --no-audit --no-fund katex@0.19.0
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';fs.mkdirSync('plugins/math/node_modules',{recursive:true});fs.symlinkSync(path.join(process.env.RUNNER_TEMP,'milkup-math-input/node_modules/katex'),'plugins/math/node_modules/katex','junction');"
      - name: Test-only binary with real updater and unchanged unconfigured production channel
        run: |
          node scripts/check-versions.mjs
          node scripts/release/update-readiness.mjs --candidate
          node scripts/ci/prepare-bundled-plugins.mjs
          pnpm --filter @milkup/desktop tauri build --ci --no-bundle --features ci-update-fixture -- --locked
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --release --features ci-update-fixture --lib actual_nsis_tests
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --release --features ci-update-fixture --lib version_gate_pe
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --release --features ci-update-fixture --lib version_gate_accepts_pe32_plus
          test -z "$(git status --porcelain)"
          node scripts/release/test-support/record-in-app-fixture.mjs "$CARGO_TARGET_DIR/release/milkup-desktop.exe" "$RUNNER_TEMP/in-app-fixture"
      - name: Retain instrumented binary only for isolated updater acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-in-app-update-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/in-app-fixture/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  native-input:
    if: inputs.task == 'native-input-accept' || inputs.task == 'signed-recovery-accept' || inputs.task == 'cross-version-accept' || inputs.task == 'in-app-update-accept'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      SOURCE_SHA: b877746f5dfd236dfc13f718ed23d837b8e4f89d
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify exact successful package build and bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          gh api repos/Auto-Plugin/milkup/actions/runs/43574228722 > "$RUNNER_TEMP/native-input-build.json"
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync(process.argv[1]));if(r.head_sha!=='76635c74508bf0798b1f93f94023540dd2436f30'||r.head_branch!=='dot/gap-native-capabilities-20261114'||r.event!=='workflow_dispatch'||r.status!=='completed'||r.conclusion!=='success'||r.path!=='.github/workflows/release-gap-native-capabilities.yml')throw Error('Exact manual build proof required')" "$RUNNER_TEMP/native-input-build.json"
          gh run download 43574228722 --repo Auto-Plugin/milkup --name milkup-b877-native-input-candidate-43574228722 --dir "$RUNNER_TEMP/native-input-package"
          node scripts/release/verify-candidate.mjs "$RUNNER_TEMP/native-input-package" "$SOURCE_SHA" windows-standard
          node --test scripts/ci/native-ime-contract.test.mjs scripts/release/verify-candidate.test.mjs scripts/release/recovery.test.mjs
      - name: Reuse the exact successful new version fixture without rebuilding
        if: inputs.task == 'cross-version-accept' || inputs.task == 'in-app-update-accept'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Auto-Plugin/milkup/actions/runs/43590520662 > "$RUNNER_TEMP/cross-version-build.json"
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync(process.argv[1]));if(r.head_sha!=='7be305ecbdabe001710c3b3bf0509d297e7b91af'||r.event!=='workflow_dispatch'||r.status!=='completed'||r.conclusion!=='success'||r.path!=='.github/workflows/release-gap-native-capabilities.yml')throw Error('Exact fixture build proof required')" "$RUNNER_TEMP/cross-version-build.json"
          gh run download 43590520662 --repo Auto-Plugin/milkup --name milkup-cross-version-test-fixture-43590520662 --dir "$RUNNER_TEMP/cross-version-package"
          node scripts/release/verify-candidate.mjs "$RUNNER_TEMP/cross-version-package" 5fd33f2b63de2755268af6d669b0f4b3b1f21b96 windows-standard
          node --test scripts/release/cross-version-contract.test.mjs
      - name: Reuse exact feature binary for real application path only
        if: inputs.task == 'in-app-update-accept'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Auto-Plugin/milkup/actions/runs/43610366335 > "$RUNNER_TEMP/in-app-fixture-build.json"
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync(process.argv[1]));if(r.head_sha!=='6eb10ba8aa21c42ed6291f8ebfc2cfdc68bbe784'||r.event!=='workflow_dispatch'||r.status!=='completed'||r.conclusion!=='success'||r.path!=='.github/workflows/release-gap-native-capabilities.yml')throw Error('Exact test binary build proof required')" "$RUNNER_TEMP/in-app-fixture-build.json"
          gh run download 43610366335 --repo Auto-Plugin/milkup --name milkup-in-app-update-fixture-43610366335 --dir "$RUNNER_TEMP/in-app-fixture"
      - name: Exercise TLS fixture before launching the application
        if: inputs.task == 'in-app-update-accept'
        shell: pwsh
        run: |
          $env:TEST_OPENSSL=(Get-Command pwsh -CommandType Application | Select-Object -First 1).Source
          node --test scripts/release/in-app-update-server.test.mjs scripts/release/in-app-update-contract.test.mjs
          if ($LASTEXITCODE) {throw 'Strict endpoint/evidence tests failed'}
      - name: Parse all native acceptance scripts before any installation
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          foreach($file in @('scripts/release/install-candidate.ps1','scripts/release/run-repair-health-standard.ps1','scripts/release/cross-version-state.ps1','scripts/release/in-app-update-native.ps1')) {
            $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count) { throw ($errors|Out-String) }
          }
      - name: Verify strict native NSIS registry path handling
        if: inputs.task == 'cross-version-accept'
        shell: pwsh
        run: ./scripts/release/cross-version-path.test.ps1
      - name: Compile owned-process native keys with official existing SDK
        if: inputs.task == 'native-input-accept'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'native-input-compile'
          $null=New-Item -ItemType Directory $out
          $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Existing official C++ toolchain unavailable' }
          $command='call "'+$vs+'\VC\Auxiliary\Build\vcvars64.bat" && cl /nologo /W4 /WX /EHsc /std:c++17 scripts\ci\windows-owned-ime-input.cpp /Fe:scripts\ci\windows-owned-ime-input.exe /Fo:"'+$out+'\input.obj" /link ole32.lib uuid.lib user32.lib'
          cmd /d /c $command 2>&1 | Tee-Object "$out/compile.txt"
          if ($LASTEXITCODE) { throw 'Native owned-input compile failed' }
          Get-FileHash scripts/ci/windows-owned-ime-input.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content "$out/input-hash.json"
          $tokens=$null;$errors=$null
          foreach($file in @('scripts/release/install-candidate.ps1','scripts/release/run-repair-health-standard.ps1')) {
            $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count) { throw ($errors|Out-String) }
          }
      - name: Exact installed acceptance under an owned ordinary user and normal close
        shell: pwsh
        env:
          ACCEPTANCE_TASK: ${{ inputs.task }}
        run: |
          $before=(Get-FileHash release/update-channel.json -Algorithm SHA256).Hash
          $nativeIme=$env:ACCEPTANCE_TASK -ceq 'native-input-accept'
          $crossVersion=$env:ACCEPTANCE_TASK -ceq 'cross-version-accept'
          $signedRecovery=$env:ACCEPTANCE_TASK -ceq 'signed-recovery-accept' -or $crossVersion
          $crossDirectory=if ($crossVersion) {"$env:RUNNER_TEMP/cross-version-package"} else {''}
          $inApp=$env:ACCEPTANCE_TASK -ceq 'in-app-update-accept'
          $updateDirectory=if ($inApp) {"$env:RUNNER_TEMP/cross-version-package"} else {''}
          $fixtureDirectory=if ($inApp) {"$env:RUNNER_TEMP/in-app-fixture"} else {''}
          if (!$nativeIme -and !$signedRecovery -and !$inApp) { throw 'Explicit acceptance scope required' }
          ./scripts/release/run-repair-health-standard.ps1 -Directory "$env:RUNNER_TEMP/native-input-package" -SourceSha $env:SOURCE_SHA -Variant windows-standard -EvidenceDirectory "$env:RUNNER_TEMP/native-input-evidence" -NativeIme:$nativeIme -SignedRecovery:$signedRecovery -CrossVersionDirectory $crossDirectory -InAppUpdateDirectory $updateDirectory -InAppUpdateFixtureDirectory $fixtureDirectory
          if ((Get-FileHash release/update-channel.json -Algorithm SHA256).Hash -cne $before) { throw 'Production update configuration changed' }
          if ($crossVersion) {
            node scripts/release/cross-version-contract.mjs "$env:RUNNER_TEMP/native-input-evidence"
            if ($LASTEXITCODE) { throw 'Full cross-version evidence contract failed' }
          }
          if ($inApp) {
            node scripts/release/in-app-update-contract.mjs "$env:RUNNER_TEMP/native-input-evidence" "$env:RUNNER_TEMP/cross-version-package/milkup-2.0.0-beta.11-windows-standard-5fd33f2b63de.exe"
            if ($LASTEXITCODE) {throw 'Full native in-app update evidence failed'}
          }
          $before | Set-Content "$env:RUNNER_TEMP/native-input-evidence/unchanged-production-channel.sha256"
      - name: Retain failures and exact candidate observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installed-${{ inputs.task }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-input-evidence/
            ${{ runner.temp }}/native-input-compile/*.txt
            ${{ runner.temp }}/native-input-compile/*.json
            ${{ runner.temp }}/native-input-build.json
            ${{ runner.temp }}/in-app-fixture-build.json
            ${{ runner.temp }}/in-app-fixture/fixture-manifest.json
            ${{ runner.temp }}/cross-version-build.json
            ${{ runner.temp }}/cross-version-package/manifest.json
            ${{ runner.temp }}/native-input-package/manifest.json
            ${{ runner.temp }}/native-input-package/native-input-provenance.json
          retention-days: 7
          if-no-files-found: error
