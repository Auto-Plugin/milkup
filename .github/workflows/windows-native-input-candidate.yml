name: Exact b877 Windows input acceptance candidate (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-native-input-candidate
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      BASELINE_SHA: b877746f5dfd236dfc13f718ed23d837b8e4f89d
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b877746f5dfd236dfc13f718ed23d837b8e4f89d
          path: application
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Exact unchanged source and locked build tools
        run: |
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git status --porcelain)"
          npm install --global pnpm@11.7.0 --ignore-scripts
          rustup toolchain install 1.99.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.99.0' >> "$GITHUB_ENV"
      - name: Restore locked workspace and reviewed math input
        run: |
          pnpm install --frozen-lockfile --config.manage-package-manager-versions=false
          npm install --prefix "$RUNNER_TEMP/milkup-math-input" --ignore-scripts --no-audit --no-fund katex@0.19.0
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';fs.mkdirSync('plugins/math/node_modules',{recursive:true});fs.symlinkSync(path.join(process.env.RUNNER_TEMP,'milkup-math-input/node_modules/katex'),'plugins/math/node_modules/katex','junction');"
      - name: Preserve source and release contracts
        run: |
          node scripts/check-versions.mjs
          node --test scripts/release/distribution.test.mjs scripts/release/recovery.test.mjs scripts/check-updater-vendor.test.mjs
          node scripts/release/update-readiness.mjs --candidate
          pnpm --filter @milkup/desktop typecheck
      - name: Pinned native packaging tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $evidence=Join-Path $env:RUNNER_TEMP 'distribution-tools'
          New-Item -ItemType Directory $evidence|Out-Null
          ./scripts/ci/prepare-windows-nsis-tools.ps1 -EvidenceDirectory $evidence
      - name: Build only the standard candidate needed for new native IME coverage
        run: node scripts/release/build-candidate.mjs windows-standard "$RUNNER_TEMP/milkup-candidate" "$BASELINE_SHA"
      - name: Verify candidate identity and record original-byte comparison
        run: |
          node scripts/release/verify-candidate.mjs "$RUNNER_TEMP/milkup-candidate/deliverable" "$BASELINE_SHA" windows-standard
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';const p=path.join(process.env.RUNNER_TEMP,'milkup-candidate/deliverable'),m=JSON.parse(fs.readFileSync(path.join(p,'manifest.json')));const original='605a428bd3f985e82854ead0f6f24026780449df0402257793ba474f8a45a425';fs.writeFileSync(path.join(p,'native-input-provenance.json'),JSON.stringify({sourceSha:process.env.BASELINE_SHA,harnessSha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,originalSha256:original,newManifest:m,scope:'New exact-source build for native input acceptance; no installed IME/DPI result yet; preserved original package not replaced'},null,2));"
      - name: Retain new unsigned test bytes, never a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milkup-b877-native-input-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/milkup-candidate/deliverable/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
