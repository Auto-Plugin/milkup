name: Fixed Mermaid bounded prototype
on:
  push:
    branches: [dot/milkup-v2-mermaid-prototype]
    paths:
      - .github/workflows/v2-mermaid-fixed-prototype.yml
      - scripts/experiments/mermaid-fixed-prototype/**
permissions:
  contents: read
concurrency:
  group: milkup-fixed-mermaid-prototype
  cancel-in-progress: false
jobs:
  prototype:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/milkup-v2-mermaid-prototype' &&
      github.event.repository.private == false &&
      github.event.deleted == false &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[mermaid-fixed-prototype]')
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/experiments/mermaid-fixed-prototype
      - name: Parse scripts and compile the account supervisor before Cargo
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'scripts/experiments/mermaid-fixed-prototype'
          foreach ($name in @('run-reviewed-windows.ps1','run-standard-user.ps1','visual-evidence.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "$root/$name"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Add-Type -Path "$root/StandardUserProcess.cs"
      - name: Run reviewed fixed code and data corpus
        id: run
        run: ./scripts/experiments/mermaid-fixed-prototype/run-reviewed-windows.ps1
      # This authorized retry emits only synthetic JSON into Actions logs/summary.
      # Explicit visual-evidence runs emit only bounded synthetic PNG chunks in
      # logs. No Actions artifact, executable, installer, profile or credential.
