name: Mermaid exact delivered installer lifecycle
on:
  push:
    branches: [dot/mermaid-stability-20261104, dot/mermaid-plugin-modes-20261109]
  workflow_dispatch:
    inputs:
      scope:
        description: All historical profiles, one legacy case, or the exact prior beta.10 profiles
        type: choice
        options: [all, filtered-admin-enabled, delivered-beta10]
        default: all
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mermaid-rebuild-windows-compile
  queue: max
  cancel-in-progress: false
jobs:
  lifecycle:
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mermaid-exact-installer-lifecycle]'))) && github.repository == 'Auto-Plugin/milkup' && (github.ref == 'refs/heads/dot/mermaid-stability-20261104' || github.ref == 'refs/heads/dot/mermaid-plugin-modes-20261109')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify harness source and unchanged application implementation
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Wrong harness source' }
          git merge-base --is-ancestor d06d31486b349c51a183d022378b04138aa2ba16 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Delivered application is not an ancestor' }
          git diff --exit-code d06d31486b349c51a183d022378b04138aa2ba16 HEAD -- vendor/wry .gitattributes scripts/frontend-mermaid-document.mjs apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/tauri.conf.json apps/desktop/vite.config.ts apps/desktop/src-tauri/mermaid-engine apps/desktop/src-tauri/src apps/desktop/src packages/core/src packages/view-dom/src plugins/diagrams-worker
          if ($LASTEXITCODE -ne 0) { throw 'Application implementation differs from delivered candidate' }
          node --test scripts/ci/prepare-delivered-mermaid-lifecycle.test.mjs tests/windows/mermaid-product-e2e.test.mjs tests/windows/verify-installed-binary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact package verification regressions failed' }
          ./tests/windows/installer-wrapper.test.ps1
          ./tests/windows/account-kind-wrapper.test.ps1
          $evidence = Join-Path $env:RUNNER_TEMP 'exact-delivered-lifecycle-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          'EXACT_LIFECYCLE_EVIDENCE=' + $evidence >> $env:GITHUB_ENV
          'CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'exact-lifecycle-fixture-target') >> $env:GITHUB_ENV
      - name: Download immutable accepted artifacts and verify original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (& gh api repos/Auto-Plugin/milkup/actions/runs/42569506864 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $source.status -cne 'completed' -or $source.conclusion -cne 'success' -or $source.head_sha -cne 'd06d31486b349c51a183d022378b04138aa2ba16' -or $source.path -cne '.github/workflows/mermaid-windows-trial-delivery.yml') { throw 'Exact delivery run is not accepted' }
          $source | ConvertTo-Json -Depth 32 | Set-Content (Join-Path $env:EXACT_LIFECYCLE_EVIDENCE 'accepted-delivery-run.json') -Encoding utf8
          $inputs = @(
            @{ name = 'delivery'; run = '42569506864'; id = '13653464012'; sha = 'b8f4b92e5f1d6fd5450580dc2c91406967b0881b5b5dbcf17688d72fdaae78bf' },
            @{ name = 'inspection'; run = '42569506864'; id = '13654115843'; sha = '07e85caf04206336c22199d4d01202cf06c35b9ea4664a3f7033f44253bf0c4a' },
            @{ name = 'prior-delivery'; run = '42148997347'; id = '13473705011'; sha = 'd6a6e5e448ecdd2f209c9276d46981c726fb23b8411e062849ba7610e805cc83' }
          )
          foreach ($item in $inputs) {
            $metadata = (& gh api ('repos/Auto-Plugin/milkup/actions/artifacts/' + $item.id) | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $metadata.expired -or [string]$metadata.workflow_run.id -cne $item.run -or $metadata.digest -cne ('sha256:' + $item.sha)) { throw 'Accepted artifact identity changed or expired' }
            $metadata | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $env:EXACT_LIFECYCLE_EVIDENCE ($item.name + '-artifact.json')) -Encoding utf8
            $zip = Join-Path $env:RUNNER_TEMP ('exact-' + $item.name + '.zip')
            & gh api ('repos/Auto-Plugin/milkup/actions/artifacts/' + $item.id + '/zip') > $zip
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $item.sha) { throw 'Original artifact ZIP bytes differ' }
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP ('exact-' + $item.name))
          }
          $delivery = Join-Path $env:RUNNER_TEMP 'exact-delivery'
          $installer = Join-Path $delivery 'milkup-2.0.0-beta.10-windows-x64-d06d31486b34-setup.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0e6f44631600c420d0517ae6d6f3822f87271ca2721a818c73c6f7a274d3bee2') { throw 'Requested installer differs' }
          $extracted = Join-Path $env:RUNNER_TEMP 'exact-nsis-extracted'
          & 7z x $installer "-o$extracted" -y
          if ($LASTEXITCODE -ne 0) { throw 'Read-only NSIS extraction failed' }
          $comparison = Join-Path $env:RUNNER_TEMP 'exact-comparison-input'
          node scripts/ci/prepare-delivered-mermaid-lifecycle.mjs $delivery (Join-Path $env:RUNNER_TEMP 'exact-inspection') $extracted $comparison
          if ($LASTEXITCODE -ne 0) { throw 'Immutable delivery input binding failed' }
          Copy-Item (Join-Path $comparison 'reuse-receipt.json') (Join-Path $env:EXACT_LIFECYCLE_EVIDENCE 'reuse-receipt.json')
          'EXACT_REUSE_RECEIPT=' + (Join-Path $comparison 'reuse-receipt.json') >> $env:GITHUB_ENV
          $zip = Join-Path $env:RUNNER_TEMP 'exact-beta9.zip'
          & gh api repos/Auto-Plugin/milkup/actions/artifacts/13270072153/zip > $zip
          if ($LASTEXITCODE -ne 0) { throw 'Pinned old package unavailable' }
          $old = Join-Path $env:RUNNER_TEMP 'exact-beta9'
          Expand-Archive -LiteralPath $zip -DestinationPath $old
          $baseline = @(Get-ChildItem $old -File -Filter '*setup.exe')
          if ($baseline.Count -ne 1 -or (Get-FileHash $baseline[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'f7fe28275477e8957653649924348bc06e24b4b49d63f6e1d6a6f08ed65c6fbf') { throw 'Wrong beta.9 installer' }
          'EXACT_BASELINE_INSTALLER=' + $baseline[0].FullName >> $env:GITHUB_ENV
          $priorInstaller = Join-Path (Join-Path $env:RUNNER_TEMP 'exact-prior-delivery') 'milkup-2.0.0-beta.10-windows-x64-40c66b69eddf-setup.exe'
          if ((Get-FileHash $priorInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'd6d02410a7165a2f06ef3e5ceca00e70f3a78b14570f353e59d5b569da5d1e91') { throw 'Exact prior beta.10 installer changed' }
          'EXACT_PRIOR_BETA10_INSTALLER=' + $priorInstaller >> $env:GITHUB_ENV
      - name: Build only the test catalog fixture helper
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler unavailable' }
          rustup run 1.99.0 cargo build --release --locked --manifest-path tests/windows/catalog-migration-fixture/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Test-only catalog fixture build failed' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Harness checkout changed' }
      - name: Verify same installer in declared old-profile upgrade and uninstall scenarios
        env:
          LIFECYCLE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reuse = Get-Content $env:EXACT_REUSE_RECEIPT -Raw | ConvertFrom-Json
          if ($env:LIFECYCLE_SCOPE -cnotin @('all','filtered-admin-enabled','delivered-beta10')) { throw 'Unknown lifecycle scope' }
          @{ scope = $env:LIFECYCLE_SCOPE; expectedCases = $(if ($env:LIFECYCLE_SCOPE -ceq 'all') { 12 } elseif ($env:LIFECYCLE_SCOPE -ceq 'delivered-beta10') { 4 } else { 1 }); historicalBaselines = @('beta9','delivered-beta10'); applicationCandidateSha = $reuse.applicationCandidateSha; installerSha256 = $reuse.installer.sha256 } | ConvertTo-Json | Set-Content (Join-Path $env:EXACT_LIFECYCLE_EVIDENCE 'execution-scope.json') -Encoding utf8
          $failures = @()
          foreach ($kind in @('pure-standard','filtered-admin')) {
            # Exercise the user's previously delivered frontend package before the legacy matrix.
            foreach ($baselineKind in @('delivered-beta10','beta9')) {
              if ($env:LIFECYCLE_SCOPE -ceq 'delivered-beta10' -and $baselineKind -cne 'delivered-beta10') { continue }
              $choices = $(if ($baselineKind -ceq 'beta9') { @('enabled','disabled','same-version','startup-failure') } else { @('enabled','disabled') })
              $baselinePath = $(if ($baselineKind -ceq 'beta9') { $env:EXACT_BASELINE_INSTALLER } else { $env:EXACT_PRIOR_BETA10_INSTALLER })
              foreach ($choice in $choices) {
                if ($env:LIFECYCLE_SCOPE -ceq 'filtered-admin-enabled' -and ($kind -cne 'filtered-admin' -or $choice -cne 'enabled' -or $baselineKind -cne 'beta9')) { continue }
                $caseName = $(if ($baselineKind -ceq 'beta9') { "$kind-$choice" } else { "$kind-$baselineKind-$choice" })
                try {
                  ./scripts/ci/run-windows-mermaid-product-e2e.ps1 -RendererMode frontend -PinnedDeliveredLifecycle -ApplicationCandidateSha $reuse.applicationCandidateSha -Binary $reuse.binary.path -ExpectedBinarySha256 $reuse.binary.sha256 -Installer $reuse.installer.path -ExpectedInstallerSha256 $reuse.installer.sha256 -ExpectedVersion '2.0.0-beta.10' -PackageManifest $reuse.packageManifest.path -ExpectedPackageManifestSha256 $reuse.packageManifest.sha256 -LifecycleBaselineInstaller $baselinePath -LifecycleBaselineKind $baselineKind -MigrationChoice $choice -ExpectedCommit $env:GITHUB_SHA -ProductionAssetsConfirmed -AccountKind $kind -EvidenceDirectory (Join-Path $env:EXACT_LIFECYCLE_EVIDENCE $caseName)
                } catch { $failures += "$caseName : $($_.Exception.Message)"; Write-Host "::error::$caseName failed; original evidence retained" }
              }
            }
          }
          if ((Get-FileHash $reuse.installer.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $reuse.installer.sha256) { throw 'Original installer changed during verification' }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Retain evidence only; never republish the installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-exact-delivered-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-delivered-lifecycle-evidence
          retention-days: 7
          if-no-files-found: error
