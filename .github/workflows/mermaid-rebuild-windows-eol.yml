name: Mermaid Windows synthetic EOL diagnostic

# Mechanism experiment only. No build, app execution, accounts or source rewrite.
on:
  push:
    branches: [dot/mermaid-rebuild-20261103]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-rebuild-windows-compile
  cancel-in-progress: false

jobs:
  eol:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/mermaid-rebuild-20261103' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false &&
        contains(github.event.head_commit.message, '[mermaid-eol-diagnostic]')))
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ca10c4e17fa1b8114ba65bd32da8082d625fbe16
          path: original
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: instrumentation
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Inspect exact original bytes and isolated synthetic LF rewrites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node instrumentation/tests/windows/diagnose-generated-schema-eol.mjs (Join-Path $env:GITHUB_WORKSPACE 'original') $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Read-only source or synthetic EOL evidence failed' }
          'Synthetic mechanism evidence only; original ca10 source remains unchanged. This does not replay Tauri build or constitute Windows UI acceptance.' >> $env:GITHUB_STEP_SUMMARY
