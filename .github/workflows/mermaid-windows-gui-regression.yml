name: Mermaid delivered beta9 GUI regression

# The existing delivered installer is reinstalled under a fresh standard user.
# Application identity stays a5556bee; harness identity is the exact new checkout.
# Never reconstruct a compiled binary from its NSIS-transformed image.
on:
  push:
    branches: [dot/mermaid-stability-20261104]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mermaid-rebuild-windows-compile
  queue: max
  cancel-in-progress: false

jobs:
  baseline:
    if: >-
      github.repository == 'Auto-Plugin/milkup' &&
      github.ref == 'refs/heads/dot/mermaid-stability-20261104' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deleted == false && contains(github.event.head_commit.message, '[mermaid-gui-baseline]')))
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify clean harness and regression contracts
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Harness checkout identity changed' }
          git merge-base --is-ancestor f26c379042e7fbc3ce4508e23e6ddf28e6b6463b HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Harness is outside the preserved delivery baseline' }
          node --test tests/windows/mermaid-gui-regression.test.mjs tests/windows/stage-mermaid-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'GUI evidence regression tests failed' }
          ./tests/windows/mermaid-gui-observer.test.ps1
          foreach ($file in @('run-windows-mermaid-product-e2e.ps1', 'run-windows-mermaid-gui-observer.ps1', 'prepare-mermaid-beta9-baseline.ps1')) {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/ci/$file"), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Download and independently pin actual delivered bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci/prepare-mermaid-beta9-baseline.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'mermaid-beta9-baseline')
      - name: Reinstall and test natural file opening, stability, consoles and close
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mermaid-beta9-baseline'
          $record = Get-Content (Join-Path $root 'baseline-provenance.json') -Raw | ConvertFrom-Json
          ./scripts/ci/run-windows-mermaid-product-e2e.ps1 -HarnessMode gui-regression -ApplicationCandidateSha $record.applicationCandidateSha -Binary $record.extractedExpectedImage.path -ExpectedBinarySha256 $record.extractedExpectedImage.sha256 -Installer $record.installer.path -ExpectedInstallerSha256 $record.installer.sha256 -ExpectedVersion '2.0.0-beta.9' -PackageManifest $record.packageManifest.path -ExpectedPackageManifestSha256 $record.packageManifest.sha256 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'mermaid-beta9-gui-evidence') -ExpectedCommit $env:GITHUB_SHA -ProductionAssetsConfirmed -AccountKind pure-standard
      - name: Retain original bounded evidence including failures
        id: evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'mermaid-beta9-gui-evidence'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { exit 0 }
          $staging = Join-Path $env:RUNNER_TEMP 'mermaid-beta9-gui-retained'
          node tests/windows/stage-mermaid-evidence.mjs $source $staging $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'GUI evidence failed bounded provenance verification' }
          "directory=$staging" >> $env:GITHUB_OUTPUT
          'ready=true' >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.evidence.outputs.ready == 'true'
        with:
          name: mermaid-beta9-gui-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mermaid-beta9-gui-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mermaid-beta9-baseline/baseline-provenance.json
          retention-days: 7
          if-no-files-found: warn
