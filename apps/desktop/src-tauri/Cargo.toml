[package]
name = "milkup-desktop"
version = "2.0.0-beta.6"
description = "milkup desktop shell"
edition = "2021"

[lib]
name = "milkup_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell_Common"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
soup = { package = "soup3", version = "=0.5.0" }
javascriptcore-rs = "=1.1.2"

[dev-dependencies]
tauri = { version = "2.9.5", features = ["test"] }
base64 = "0.22"

[patch.crates-io]
tauri-plugin-updater = { path = "../../../vendor/tauri-plugin-updater" }
