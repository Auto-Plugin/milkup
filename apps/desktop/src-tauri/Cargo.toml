[package]
name = "milkup-desktop"
version = "0.1.0"
description = "milkup desktop shell"
edition = "2021"

[lib]
name = "milkup_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
