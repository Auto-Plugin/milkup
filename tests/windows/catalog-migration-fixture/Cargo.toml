[package]
name = "milkup-catalog-migration-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "milkup-catalog-migration-fixture"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4.3"
semver = "1"
# Tauri reexports this exact URL type; no WebView application is linked into the test helper.
tauri = { package = "url", version = "2" }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"
